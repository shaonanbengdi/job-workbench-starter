RENDER.calendar = function(){
  var c=document.getElementById('content');
  var d=state.calDate;
  var title;
  if(state.calMode==='month') title=d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月';
  else if(state.calMode==='week'){ var wk=weekRange(d); title=fmtDate(wk[0])+' ~ '+fmtDate(wk[1]); }
  else title=fmtDate(d);

  var html='<div class="cal-head">'
    +'<button class="btn sm" onclick="calNav(-1)">‹ 上一个</button>'
    +'<button class="btn sm" onclick="state.calDate=new Date();refreshAll()">今天</button>'
    +'<button class="btn sm" onclick="calNav(1)">下一个 ›</button>'
    +'<b style="font-size:16px;margin:0 8px">'+title+'</b>'
    +'<span class="spacer"></span>'
    +['month','week','day'].map(function(m){
      var name={month:'月',week:'周',day:'日'}[m];
      return '<button class="btn sm" onclick="state.calMode=\''+m+'\';refreshAll()"'+(state.calMode===m?' style="border-color:var(--primary);color:var(--primary)"':'')+'>'+name+'</button>';
    }).join('')
    +'</div>'
    +'<div class="legend" style="margin-bottom:10px">';
  for(var k in EVENT_TYPES) html+='<span><i style="background:'+EVENT_TYPES[k].color+'"></i>'+EVENT_TYPES[k].name+'</span>';
  html+='</div>';

  if(state.calMode==='month') html+=calMonthHTML(d);
  else if(state.calMode==='week') html+=calWeekHTML(d);
  else html+=calDayHTML(d);
  c.innerHTML=html;
};
function eventsOn(dateStr){ return DB.events.filter(function(e){return e.date===dateStr;}); }
function calNav(dir){
  var d=state.calDate;
  if(state.calMode==='month') state.calDate=new Date(d.getFullYear(), d.getMonth()+dir, 1);
  else if(state.calMode==='week') state.calDate=addDays(d, dir*7);
  else state.calDate=addDays(d, dir);
  refreshAll();
}
function calMonthHTML(d){
  var today=todayStr();
  var first=new Date(d.getFullYear(), d.getMonth(), 1);
  var startDow=(first.getDay()+6)%7; /* 周一起 */
  var start=addDays(first, -startDow);
  var html='<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(w){ html+='<div class="cal-dow">'+w+'</div>'; });
  for(var i=0;i<42;i++){
    var day=addDays(start,i), ds=fmtDate(day);
    var other=day.getMonth()!==d.getMonth();
    html+='<div class="cal-cell'+(other?' other':'')+(ds===today?' today':'')+'" '
      +'data-drop="event" data-drop-date="'+ds+'" '
      +'onclick="openEventForm(null,\''+ds+'\')">'
      +'<div class="cd-num"><span>'+day.getDate()+'</span><span class="cd-add" onclick="event.stopPropagation();openEventForm(null,\''+ds+'\')">+</span></div>';
    eventsOn(ds).slice(0,5).forEach(function(e){
      html+='<span class="cal-ev '+evType(e.type).cls+'" draggable="true" '
        +'data-drag="event" data-id="'+e.id+'" '
        +'onclick="event.stopPropagation();openEventForm(\''+e.id+'\')" '
        +'title="'+esc(e.title)+'">'+esc(e.title)+'</span>';
    });
    var more=eventsOn(ds).length-5;
    if(more>0) html+='<span class="muted" style="font-size:11px">+'+more+' 更多</span>';
    html+='</div>';
  }
  html+='</div>';
  return html;
}
function calWeekHTML(d){
  var wk=weekRange(d), today=todayStr();
  var html='<div class="cal-week">';
  for(var i=0;i<7;i++){
    var day=wk[0].getTime()?addDays(wk[0],i):null, ds=fmtDate(day);
    html+='<div class="cal-daycol'+(ds===today?' today':'')+'" '
      +'data-drop="event" data-drop-date="'+ds+'">'
      +'<h4><span>'+(day.getMonth()+1)+'/'+day.getDate()+' 周'+'一二三四五六日'[i]+'</span>'
      +' <a href="javascript:void(0)" style="color:var(--primary)" onclick="openEventForm(null,\''+ds+'\')">+</a></h4>';
    eventsOn(ds).forEach(function(e){
      html+='<div class="day-ev '+evType(e.type).cls+'" draggable="true" '
        +'data-drag="event" data-id="'+e.id+'" '
        +'onclick="openEventForm(\''+e.id+'\')">'
        +'<span class="de-time">'+esc(e.time||'全天')+'</span>'
        +'<span class="de-title">'+esc(e.title)+'</span>'
        +(e.jobId?'<div class="de-job">'+esc((findJob(e.jobId)||{}).company||'')+'</div>':'')
        +'</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  return html;
}
function calDayHTML(d){
  var ds=fmtDate(d);
  var list=eventsOn(ds).sort(function(a,b){return (a.time||'')<(b.time||'')?-1:1;});
  var html='<div class="card"><h3>'+ds+' 日程 <button class="btn sm primary" style="margin-left:10px" onclick="openEventForm(null,\''+ds+'\')">新建事件</button></h3>';
  if(!list.length) html+='<div class="muted">当天暂无事件，点击「新建事件」添加。</div>';
  list.forEach(function(e){
    var j=e.jobId?findJob(e.jobId):null;
    html+='<div class="day-ev '+evType(e.type).cls+'" draggable="true" '
      +'data-drag="event" data-id="'+e.id+'" '
      +'onclick="openEventForm(\''+e.id+'\')">'
      +'<span class="de-time">'+esc(e.time||'全天')+'</span>'
      +'<span class="de-title">'+esc(e.title)+'</span>'
      +' <span class="tag '+({deadline:'red',written:'orange',interview:'blue',follow:'green'})[e.type]+'">'+evType(e.type).name+'</span>'
      +(j?'<div class="de-job">关联：'+esc(j.company)+' · '+esc(j.title)+'</div>':'')
      +'</div>';
  });
  html+='</div>';
  return html;
}
/* 拖拽事件：状态由统一拖拽管理器维护。
   原实现把 id 存在全局变量里且没有 dragend 兜底清理，
   拖到无效区域释放后 _dragEventId 会残留，下一次操作可能误移事件。 */
var _dragEventId=null;
function dropEvent(id,newDate){
  if(!id||!newDate) { _dragEventId=null; return; }
  var e=null;
  for(var i=0;i<DB.events.length;i++) if(DB.events[i].id===id) e=DB.events[i];
  if(!e){ _dragEventId=null; return; }
  if(e.date===newDate){ _dragEventId=null; return; }
  e.date=newDate;
  saveEvents();
  showToast('事件已移至 '+newDate,'success');
  _dragEventId=null;
  rerenderCurrent();
}
function openEventForm(id, presetDate){
  var e=id?DB.events.filter(function(x){return x.id===id;})[0]:null;
  /* 快捷创建按钮 */
  var quickBtns='';
  if(!e){
    quickBtns='<div class="form-group"><label>快捷创建</label><div class="quick-row" style="margin-bottom:8px">'
      +'<button class="btn sm" style="border-color:var(--red);color:var(--red)" onclick="quickEvent(\'deadline\',\''+(presetDate||todayStr())+'\')">截止日期</button>'
      +'<button class="btn sm" style="border-color:var(--orange);color:var(--orange)" onclick="quickEvent(\'written\',\''+(presetDate||todayStr())+'\')">笔试</button>'
      +'<button class="btn sm" style="border-color:var(--blue);color:var(--blue)" onclick="quickEvent(\'interview\',\''+(presetDate||todayStr())+'\')">面试</button>'
      +'<button class="btn sm" style="border-color:var(--green);color:var(--green)" onclick="quickEvent(\'follow\',\''+(presetDate||todayStr())+'\')">跟进提醒</button>'
      +'</div><div class="muted" style="font-size:11px">点击快捷创建，或手动填写下方表单</div></div><hr style="margin:8px 0;border:none;border-top:1px solid var(--border)">';
  }
  var body=quickBtns
    +'<input type="hidden" id="ef_id" value="'+(e?e.id:'')+'">'
    +'<div class="form-group"><label>标题</label><input class="f" id="ef_title" value="'+esc(e?e.title:'')+'" placeholder="如：星驰汽车网申截止"></div>'
    +'<div class="grid2">'
    +'<div class="form-group"><label>类型</label><select class="f" id="ef_type">';
  for(var k in EVENT_TYPES) body+='<option value="'+k+'"'+(e&&e.type===k?' selected':'')+'>'+EVENT_TYPES[k].name+'</option>';
  body+='</select></div>'
    +'<div class="form-group"><label>关联岗位</label><select class="f" id="ef_job"><option value="">（不关联）</option>';
  DB.jobs.forEach(function(j){ body+='<option value="'+j.id+'"'+(e&&e.jobId===j.id?' selected':'')+'>'+esc(j.company)+' · '+esc(j.title)+'</option>'; });
  body+='</select></div></div>'
    +'<div class="grid2">'
    +'<div class="form-group"><label>日期</label><input class="f" type="date" id="ef_date" value="'+esc(e?e.date:(presetDate||todayStr()))+'"></div>'
    +'<div class="form-group"><label>时间</label><input class="f" type="time" id="ef_time" value="'+esc(e?e.time:'')+'"></div>'
    +'</div>'
    +'<div class="form-group"><label>提醒设置</label><div class="row">提前 <input class="f" type="number" min="0" id="ef_rval" style="width:90px" value="'+(e?e.remindVal:1)+'">'
    +'<select class="f" id="ef_runit" style="width:90px"><option value="days"'+(e&&e.remindUnit==='days'?' selected':'')+'>天</option><option value="hours"'+(e&&e.remindUnit==='hours'?' selected':'')+'>小时</option></select> 提醒</div></div>';
  var foot=(e?'<button class="btn danger" style="margin-right:auto" onclick="deleteEvent(\''+e.id+'\');closeModal()">删除</button>':'')
    +'<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveEventForm()">保存</button>';
  openModal(e?'编辑事件':'新建事件', body, foot);
}
function saveEventForm(){
  var id=document.getElementById('ef_id').value;
  var title=document.getElementById('ef_title').value.trim();
  if(!title){ alert('请填写标题'); return; }
  var data={ title:title, type:document.getElementById('ef_type').value,
    jobId:document.getElementById('ef_job').value,
    date:document.getElementById('ef_date').value||todayStr(),
    time:document.getElementById('ef_time').value,
    remindVal:+document.getElementById('ef_rval').value||0,
    remindUnit:document.getElementById('ef_runit').value };
  if(id){ DB.events.forEach(function(x){ if(x.id===id){ for(var k in data) x[k]=data[k]; } }); }
  else { data.id=uid(); DB.events.push(data); }
  saveEvents(); closeModal(); refreshAll();
}
function deleteEvent(id){
  if(!confirm('确定删除该事件？')) return;
  DB.events=DB.events.filter(function(x){return x.id!==id;});
  saveEvents(); refreshAll();
}
function quickEvent(type,date){
  var typeNames={deadline:'截止日期',written:'笔试',interview:'面试',follow:'跟进提醒'};
  var title=prompt('快速创建「'+typeNames[type]+'」事件\n请输入标题：','');
  if(!title) return;
  var time='';
  if(type==='written'||type==='interview') time=prompt('请输入时间（如 19:00）：','')||'';
  DB.events.push({id:uid(), title:title, type:type, jobId:'', date:date||todayStr(), time:time, remindVal:1, remindUnit:'days'});
  saveEvents();
  showToast('已创建'+typeNames[type]+'：'+title,'success');
  refreshAll();
}

function clearCandFilters(){
  _candFilter={status:'', city:'', source:'', category:'', match_level:'', education:'', company:'', keyword:''};
  renderCandidates();
}

/* 顶部四个统计卡是 renderCandidates() 按 _candData.stats 画的，
   而首次进入时数据还没到、画出来全是 0；loadCandidates() 之后只刷列表不刷卡片，
   于是要"离开再回来"数字才对。这里补一次就地更新。 */
function refreshCandStats(s){
  if(!s) return;
  var els=document.querySelectorAll('.cand-stat .num');
  if(els.length<4) return;
  els[0].textContent=s.total||0;
  els[1].textContent=s.pending||0;
  els[2].textContent=s.included||0;
  els[3].textContent=s.excluded||0;
}

function loadCandidates(){
  var p=new URLSearchParams();
  if(_candFilter.status) p.set('status',_candFilter.status);
  if(_candFilter.city) p.set('city',_candFilter.city);
  if(_candFilter.source) p.set('source',_candFilter.source);
  if(_candFilter.category) p.set('category',_candFilter.category);
  if(_candFilter.match_level) p.set('match_level',_candFilter.match_level);
  if(_candFilter.education) p.set('education',_candFilter.education);
  if(_candFilter.company) p.set('company',_candFilter.company);
  if(_candFilter.keyword) p.set('keyword',_candFilter.keyword);
  fetch('/api/candidates?'+p.toString())
    .then(function(r){return r.json()})
    .then(function(d){
      _candData=d;
      renderCandList(d.items);
      refreshCandStats(d.stats);
      /* 更新筛选结果计数 */
      var cntEl=document.querySelector('.cand-toolbar .muted');
      if(cntEl&&d.stats){
        cntEl.textContent='筛选结果: '+(d.stats.filtered||d.items.length)+' / '+d.stats.total;
      }
      var el=document.getElementById('scrapeBtn');
      if(el) el.disabled=_candScraping;
    })
    .catch(function(e){console.error(e)});
}

function toggleCandAll(checked){
  document.querySelectorAll('.cand-sel').forEach(function(cb){cb.checked=checked});
  updateCandBatch();
}
function updateCandBatch(){
  var sel=document.querySelectorAll('.cand-sel:checked');
  var bar=document.getElementById('candBatchBar');
  var cnt=document.getElementById('candSelCount');
  var allCb=document.getElementById('candAll');
  var totalCb=document.querySelectorAll('.cand-sel').length;
  if(sel.length){
    bar.style.display='flex';
    cnt.textContent=sel.length+'/'+totalCb;
    if(allCb) allCb.checked=(sel.length===totalCb&&totalCb>0);
    if(allCb) allCb.indeterminate=(sel.length>0&&sel.length<totalCb);
  }else{
    bar.style.display='none';
    if(allCb){allCb.checked=false;allCb.indeterminate=false;}
  }
}

function getSelectedIds(){
  var ids=[];
  document.querySelectorAll('.cand-sel:checked').forEach(function(cb){ids.push(cb.dataset.id)});
  return ids;
}

function batchCandAction(action){
  var ids=getSelectedIds();
  if(!ids.length){showToast('请先勾选记录','error');return}
  var actNames={include:'纳入',exclude:'排除',reset:'重置为待处理'};
  var actName=actNames[action]||action;
  /* 确认对话框 */
  if(!confirm('确定要对 '+ids.length+' 条记录执行「'+actName+'」操作？\n\n此操作不可撤销。')) return;
  var toApp=document.getElementById('candToApp')&&document.getElementById('candToApp').checked;
  var toEvent=document.getElementById('candToEvent')&&document.getElementById('candToEvent').checked;
  showToast('正在处理 '+ids.length+' 条记录…','info',5000);
  /* 批量操作 */
  fetch('/api/candidates/action',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:action,ids:ids,toApp:false,toEvent:false})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){
        var msg='已'+actName+d.updated+'条';
        if(d.job_created>0) msg+='，创建了'+d.job_created+'个岗位卡片';
        showToast(msg, 'success');
        /* 如果纳入时勾选了投递计划，再批量创建 */
        if(action==='include'&&toApp){
          fetch('/api/candidates/action',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'include',ids:ids,toApp:true,toEvent:toEvent})})
            .then(function(r){return r.json()})
            .then(function(d2){
              if(d2.ok) showToast('已加入投递计划'+(toEvent?'和日程':''), 'success');
              loadCandidates();
            });
        }else{
          loadCandidates();
        }
      }else{showToast('操作失败：'+d.error,'error')}
    })
    .catch(function(e){showToast('请求失败：'+e.message,'error')});
}

function batchExportSelected(){
  var ids=getSelectedIds();
  if(!ids.length){showToast('请先勾选记录','error');return}
  /* 从当前数据中筛选 */
  var items=(_candData.items||[]).filter(function(it){return ids.indexOf(it.id)>=0});
  var blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='招聘信息导出_'+ids.length+'条_'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  showToast('已导出 '+ids.length+' 条记录','success');
}

function candAction(id,action){
  if(action==='reset'){
    fetch('/api/candidates/action',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'reset',ids:[id]})})
      .then(function(r){return r.json()})
      .then(function(d){if(d.ok){showToast('已重置','success');loadCandidates()}});
    return;
  }
  // 纳入：先创建岗位卡片，再询问是否加入投递计划
  fetch('/api/candidates/action',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:action,ids:[id],toApp:false,toEvent:false})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){
        if(d.job_created>0){
          showToast('✓ 已创建岗位卡片到「岗位管理」','success');
        }
        // 再询问是否加入投递计划
        var toApp=confirm('岗位卡片已创建！\n\n是否同时加入投递计划？\n（点确定=加入，点取消=仅保留岗位卡片）');
        if(toApp){
          var toEvent=confirm('是否同时加入日程提醒？');
          fetch('/api/candidates/action',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'include',ids:[id],toApp:true,toEvent:toEvent})})
            .then(function(r){return r.json()})
            .then(function(d2){
              if(d2.ok){
                showToast('已加入投递计划'+(toEvent?'和日程':''),'success');
              }
              loadCandidates();
            });
        }else{
          loadCandidates();
        }
      }else{showToast('失败：'+d.error,'error')}
    });
}

function doScrape(){
  if(_candScraping) return;
  _candScraping=true;
  renderCandidates();
  showToast('正在抓取招聘信息…', 'info', 8000);
  fetch('/api/scrape',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json()})
    .then(function(d){
      _candScraping=false;
      if(d.ok){
        var total=d.total_new||0;
        if(total>0){
          showToast('抓取完成！新增 '+total+' 条招聘信息', 'success');
        }else{
          showToast('抓取完成，暂无新增信息', 'info');
        }
        loadCandidates();
      }else{
        showToast('抓取失败：'+d.error, 'error');
        renderCandidates();
      }
    })
    .catch(function(e){
      _candScraping=false;
      showToast('请求失败：'+e.message, 'error');
      renderCandidates();
    });
}

function showImportCand(){
  var body='<p style="margin-bottom:10px;color:#94a3b8">粘贴 JSON 数组，每条包含：title, company, city, salary, education, experience, source, publish_date, url, category</p>'
    +'<textarea class="input" id="candImportData" style="width:100%;height:260px;font-family:monospace;font-size:13px" placeholder=\'[{"title":"CFD仿真工程师","company":"星驰汽车","city":"上海","education":"硕士","source":"官网"}]\'></textarea>';
  var foot='<button class="btn" onclick="closeModal()">取消</button> '
    +'<button class="btn primary" onclick="doImportCand()">导入</button>';
  openModal('手动导入招聘信息', body, foot);
}

function doImportCand(){
  var raw=document.getElementById('candImportData').value.trim();
  if(!raw){showToast('请输入数据','error');return}
  try{
    var items=JSON.parse(raw);
    if(!Array.isArray(items)) throw new Error('需要 JSON 数组');
    fetch('/api/candidates/import',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:items})})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.ok){
          showToast('导入完成：新增 '+d.imported+' 条，跳过重复 '+d.skipped+' 条', 'success');
          closeModal();
          loadCandidates();
        }else{showToast('导入失败：'+d.error,'error')}
      })
      .catch(function(e){showToast('请求失败：'+e.message,'error')});
  }catch(e){showToast('JSON 格式错误：'+e.message,'error')}
}

/* ===== 校招快捷导航（数据来自 /api/campus-nav ← campus_nav.json，只读） ===== */
var CAMPUS = {loaded:false, loading:false, rows:[], meta:{}, kw:'', cat:'', pri:'', fit:''};

function campusPriColor(p){
  return p==='S' ? 'var(--red)' : (p==='A' ? 'var(--orange)' : 'var(--gray)');
}
function loadCampusNav(cb){
  if(CAMPUS.loaded){ if(cb) cb(); return; }
  if(CAMPUS.loading) return;
  CAMPUS.loading = true;
  function done(d){
    if(!d || !d.rows || !d.rows.length){ fail('数据文件里没有任何企业记录。'); return; }
    CAMPUS.rows = d.rows; CAMPUS.meta = d.meta||{};
    CAMPUS.meta._file = d.file||{}; CAMPUS.loaded = true; CAMPUS.loading = false;
    /* 渲染异常不再被下面的 .catch 误判成「加载失败」 */
    try {
      if(cb) cb(); else renderCampusNav();
    } catch(e) {
      console.error('[校招导航] 渲染失败', e);
      document.getElementById('content').innerHTML =
        '<div class="card"><h3>校招导航渲染失败</h3><div class="muted">'+esc(e.message)+
        '<br>数据已成功载入（'+CAMPUS.rows.length+' 家），问题出在页面脚本，请把这条报错发我。</div></div>';
    }
  }
  function fail(msg){
    CAMPUS.loading = false;
    document.getElementById('content').innerHTML =
      '<div class="card"><h3>校招导航加载失败</h3><div class="muted">'+esc(msg)+
      '<br>请确认 <code>campus_nav.json</code> 与 server.py 在同一目录。</div></div>';
  }
  /* 优先走 API；若服务端未重启（路由不存在）则降级直读同目录静态 JSON */
  function fromStatic(){
    return fetch('campus_nav.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('静态文件 HTTP '+r.status);
        return r.json();
      });
  }
  fetch('/api/campus-nav?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : fromStatic(); })
    .then(function(d){
      if(d && d.rows && d.rows.length) return done(d);
      return fromStatic().then(done);
    })
    .catch(function(e){
      fromStatic().then(done).catch(function(e2){ fail(e2.message||e.message); });
    });
}
function setCampusFilter(k,v){ CAMPUS[k]=v; renderCampusNav(); }
function campusFiltered(){
  var kw=CAMPUS.kw.trim().toLowerCase();
  return CAMPUS.rows.filter(function(r){
    if(CAMPUS.cat && r['类别']!==CAMPUS.cat) return false;
    if(CAMPUS.pri && r['优先级']!==CAMPUS.pri) return false;
    if(CAMPUS.fit && (r['对口方向']||'').indexOf(CAMPUS.fit)<0) return false;
    if(kw){
      var hay=(r['企业']+' '+r['类别']+' '+r['主要基地/工作地']+' '+r['对口方向']+' '+r['备注']+' '+r['链接状态']).toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
}
function renderCampusNav(){
  var c=document.getElementById('content');
  if(!CAMPUS.loaded){
    c.innerHTML='<div class="card"><h3>校招导航</h3><div class="muted">正在载入校招导航清单…</div></div>';

    fitOpts+='<option value="'+esc(k)+'"'+(CAMPUS.fit===k?' selected':'')+'>'+esc(k)+'（'+fits[k]+'）</option>';

  var nS=CAMPUS.rows.filter(function(r){return r['优先级']==='S';}).length;

      + '共 '+CAMPUS.rows.length+' 家（S级 '+nS+' · A级 '+nA+'）　数据日期 '
      + esc(CAMPUS.meta.updated||'') + (CAMPUS.meta._file&&CAMPUS.meta._file.mtime ? '　文件更新 '+esc(CAMPUS.meta._file.mtime) : '')
      + '<br>'+esc(CAMPUS.meta.note||'')+'</div>';
  html+='<div class="toolbar" style="margin-bottom:0">'
      + '<input id="cnKw" placeholder="搜索：企业 / 城市 / 方向，如 热管理、苏州、CFD" style="flex:1;min-width:200px" value="'+esc(CAMPUS.kw)+'">'
      + '<select id="cnPri"><option value="">全部优先级</option>'
      + ['S','A','B'].map(function(p){ var t=p==='S'?'立即投递':(p==='A'?'建议投递':'备选');
          return '<option value="'+p+'"'+(CAMPUS.pri===p?' selected':'')+'>'+p+' · '+t+'</option>'; }).join('')
      + '</select>'
      + '<select id="cnCat">'+catOpts+'</select>'
      + '<select id="cnFit">'+fitOpts+'</select>'
      + '<button class="btn" onclick="CAMPUS.kw=\'\';CAMPUS.cat=\'\';CAMPUS.pri=\'\';CAMPUS.fit=\'\';renderCampusNav()">重置</button>'
      + '<span class="muted" style="margin-left:auto">显示 <b>'+rows.length+'</b> 家</span>'
      + '</div></div>';

  if(!rows.length){
    html+='<div class="card"><div class="muted">没有匹配的企业，换个关键词或重置筛选。</div></div>';
  }
  html+='<div class="card-grid">';
  rows.forEach(function(r,i){
    var p=r['优先级']||'B';

    html+='<div class="card" style="margin-bottom:0;border-left:4px solid '+campusPriColor(p)+';padding:14px 16px">';
    html+='<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px">'

    html+='<div class="muted" style="font-size:12.5px">'+esc(r['类别'])+'　·　'+esc(r['性质'])+'</div>';
    html+='<div class="muted" style="font-size:12.5px"><b style="color:var(--text)">城市</b> '+esc(r['主要基地/工作地'])+'</div>';
    html+='<div style="font-size:12.5px;color:var(--primary-dark);margin:2px 0"><b style="color:var(--text)">对口</b> '+esc(r['对口方向'])+'</div>';
    html+='<div style="font-size:12px;margin:6px 0;word-break:break-all">';
    if(url){ html+='<a href="'+esc(url)+'" target="_blank" rel="noopener" style="color:var(--primary);text-decoration:none">'+esc(url)+'</a>'; }
    else { html+='<span class="muted">无独立入口，见下方渠道</span>'; }

    html+='</div></div>';

  el=document.getElementById('cnCat'); if(el) el.addEventListener('change', function(){ setCampusFilter('cat',this.value); });

    publish_date:CAMPUS.meta.updated||'',
    url:r['校招入口']||'',
    category:'招聘岗位',
    extra:{'批次':'2027秋招','优先级':r['优先级'],'行业大类':r['类别'],
           '企业性质':r['性质'],'对口方向':r['对口方向'],'链接状态':r['链接状态'],
           '投递渠道':r['其他投递渠道']||'','备注':r['备注']}
  };
  fetch('/api/candidates/import',{method:'POST',headers:{'Content-Type':'application/json'},

        if(d.imported) showToast('已加入候选池：'+r['企业'],'success');
        else showToast('候选池中已存在：'+r['企业'],'info');

/* ============================================================
   宣讲会日程（数据来自 /api/talks ← talks.json，只读）
   数据来自与 server.py 同目录的 talks.json（可选文件，本样本未附带）。
   格式：{ "rows": [...], "cross": [...], "meta": {...} }，每行至少含
   日期 / 时间 / 企业 / 地点 四个字段。
   ============================================================ */
var TALKS = {loaded:false, loading:false, rows:[], cross:[], meta:{}, lv:'', upcoming:true, kw:''};

var TALK_LEVELS = {
  S:{name:'S 必去', color:'var(--red)'},
  A:{name:'A 建议', color:'var(--orange)'},
  B:{name:'B 可选', color:'var(--blue)'}
};
/* 档位兜底：JSON 里出现未登记的档位时不要击穿整页 */
var TALK_LEVEL_FALLBACK = {name:'未分级', color:'var(--muted)'};
function talkLevel(k){ return TALK_LEVELS[k] || TALK_LEVEL_FALLBACK; }

function loadTalks(cb){
  if(TALKS.loaded){ if(cb) cb(); return; }
  if(TALKS.loading) return;
  TALKS.loading = true;
  function done(d){
    if(!d || !d.rows || !d.rows.length){ fail('数据文件里没有任何宣讲会记录。'); return; }
    TALKS.rows = d.rows; TALKS.cross = d.cross||[]; TALKS.meta = d.meta||{};
    TALKS.meta._file = d.file||{}; TALKS.loaded = true; TALKS.loading = false;
    /* 取数据成功 ≠ 渲染成功，两者分开兜底 */
    try {
      if(cb) cb(); else renderTalks();
    } catch(e) {
      console.error('[宣讲会日程] 渲染失败', e);
      document.getElementById('content').innerHTML =
        '<div class="card"><h3>宣讲会日程渲染失败</h3><div class="muted">'+esc(e.message)+
        '<br>数据已成功载入（'+TALKS.rows.length+' 场），问题出在页面脚本，请把这条报错发我。</div></div>';
    }
  }
  function fail(msg){
    TALKS.loading = false;
    document.getElementById('content').innerHTML =
      '<div class="card"><h3>宣讲会日程加载失败</h3><div class="muted">'+esc(msg)+
      '<br>本样本不含宣讲会数据。需要的话，把整理好的 <code>talks.json</code> 放到与 '+
      '<code>server.py</code> 同一目录即可，刷新后自动读取。'+
      '<br>格式：<code>{ "rows": [ { "日期": "2026-11-10", "时间": "19:00", "企业": "某某公司", '+
      '"地点": "报告厅" } ] }</code></div></div>';
  }
  function fromStatic(){
    return fetch('talks.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('静态文件 HTTP '+r.status); return r.json(); });
  }
  fetch('/api/talks?t='+Date.now(),{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : fromStatic(); })
    .then(function(d){ if(d && d.rows && d.rows.length) return done(d); return fromStatic().then(done); })
    .catch(function(e){ fromStatic().then(done).catch(function(e2){ fail(e2.message||e.message); }); });
}
function setTalkFilter(k,v){ TALKS[k]=v; renderTalks(); }
function talksFiltered(){
  var today=todayStr();
  var kw=TALKS.kw.trim().toLowerCase();
  return TALKS.rows.filter(function(r){
    if(TALKS.lv && r['档位']!==TALKS.lv) return false;
    if(TALKS.upcoming && r['日期'] < today) return false;
    if(kw){
      var hay=(r['企业']+' '+r['地点']+' '+r['对口说明']+' '+(r['HR']||'')).toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
}
/* 「晚上 6:30-8:00」→「18:30」，用于写入日历 */
function talkStartTime(s){
  if(!s) return '';
  var m=String(s).match(/(\d{1,2}):(\d{2})/);
  if(!m) return '';
  var h=+m[1];
  if((s.indexOf('下午')>=0 || s.indexOf('晚上')>=0) && h<12) h+=12;
  return (h<10?'0':'')+h+':'+m[2];
}
function talkWeekday(d){
  var p=String(d||'').split('-');
  if(p.length<3) return '';
  return '周'+'日一二三四五六'.charAt(new Date(+p[0], +p[1]-1, +p[2]).getDay());
}
function addTalkToCalendar(i){
  var r=TALKS.rows[i];
  if(!r) return;
  var title='宣讲会：'+String(r['企业']||'').replace(/20\d\d届.*$/,'').replace(/校园招聘.*$/,'').trim();
  if(!title) title='宣讲会：'+String(r['企业']||'');
  var dup=DB.events.filter(function(e){ return e.title===title && e.date===r['日期']; })[0];
  if(dup){ showToast('日历里已经有这场了','info'); return; }
  DB.events.push({ id:uid(), title:title, type:'reminder', jobId:'',
    date:r['日期']||todayStr(), time:talkStartTime(r['时间']),
    remindVal:1, remindUnit:'days' });
  saveEvents();
  showToast('已加入日历（提前 1 天提醒）：'+title,'success');
}
function renderTalks(){
  var c=document.getElementById('content');
  if(!TALKS.loaded){
    c.innerHTML='<div class="card"><h3>宣讲会日程</h3><div class="muted">正在载入宣讲会安排…</div></div>';
    loadTalks(function(){ renderTalks(); });
    return;
  }
  var rows=talksFiltered();
  var today=todayStr();
  var m=TALKS.meta||{};

  var html='<div class="card" style="padding:14px 18px">';
  html+='<h3 style="margin-bottom:6px">宣讲会日程 · '+esc(m.month||'')+'</h3>';
  html+='<div class="muted" style="font-size:12px;margin-bottom:10px">'
      + '江大当月共 '+esc(m.total_all||0)+' 场，对口 '+esc(m.total_focused||0)+' 场'
      + '（S <b style="color:var(--red)">'+esc(m.count_S||0)+'</b> · A '+esc(m.count_A||0)+' · B '+esc(m.count_B||0)+'）'
      + '　数据日期 '+esc(m.updated||'')
      + (TALKS.meta._file&&TALKS.meta._file.mtime ? '　文件更新 '+esc(TALKS.meta._file.mtime) : '')
      + '<br>'+esc(m.source||'')+'</div>';

  /* 时间撞车提醒：同一「日期+时段」有多场 S/A 档 */
  var conflicts={};
  TALKS.rows.forEach(function(r){
    if(!r['冲突']) return;
    var k=r['日期']+' '+r['时间'];
    (conflicts[k]=conflicts[k]||[]).push(r);
  });
  var ck=Object.keys(conflicts);
  if(ck.length){
    html+='<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12.5px">';
    html+='<b style="color:var(--red)">以下时段有多场宣讲同时开，只能选一场：</b>';
    ck.sort().forEach(function(k){
      html+='<div style="margin-top:4px">'+esc(k)+'　→　'
          + conflicts[k].map(function(r){ return '<b>'+esc(r['企业'])+'</b>（'+esc(r['地点'])+'）'; }).join(' ／ ')
          + '</div>';
    });
    html+='</div>';
  }

  var lvOpts='<option value="">全部档位</option>';
  ['S','A','B'].forEach(function(k){
    lvOpts+='<option value="'+k+'"'+(TALKS.lv===k?' selected':'')+'>'+talkLevel(k).name+'</option>';
  });
  html+='<div class="toolbar" style="margin-bottom:0">'
      + '<input id="tkKw" placeholder="搜索：企业 / 地点 / 说明" style="flex:1;min-width:180px" value="'+esc(TALKS.kw)+'">'
      + '<select id="tkLv">'+lvOpts+'</select>'
      + '<label class="muted" style="font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap">'
      + '<input type="checkbox" id="tkUp"'+(TALKS.upcoming?' checked':'')+'>只看今天及以后</label>'
      + '<button class="btn" onclick="TALKS.kw=\'\';TALKS.lv=\'\';TALKS.upcoming=true;renderTalks()">重置</button>'
      + '<span class="muted" style="margin-left:auto">显示 <b>'+rows.length+'</b> 场</span>'
      + '</div></div>';

  if(!rows.length){
    html+='<div class="card"><div class="muted">没有匹配的宣讲会，换个筛选条件或点「重置」。</div></div>';
  }else{
    html+='<div class="card" style="padding:0;overflow:auto"><table class="tb resp"><thead><tr>'
        + '<th>日期</th><th>时间</th><th>档位</th><th>企业</th><th>地点</th><th>对口说明</th><th style="white-space:nowrap">操作</th>'
        + '</tr></thead><tbody>';
    rows.forEach(function(r){
      var lv=talkLevel(r['档位']);
      var past = r['日期'] && r['日期'] < today;
      var idx = TALKS.rows.indexOf(r);
      html+='<tr'+(past?' style="opacity:.5"':'')+(r['冲突']?' style="background:#fff7f7"':'')+'>'
          + '<td style="white-space:nowrap"><b>'+esc(r['日期'])+'</b>'
          + '<span class="muted" style="margin-left:4px">'+talkWeekday(r['日期'])+'</span>'
          + (past?'<br><span class="muted" style="font-size:11px">已过</span>':'')+'</td>'
          + '<td style="white-space:nowrap">'+esc(r['时间']||'待定')+'</td>'
          + '<td><span class="tag" style="background:'+lv.color+';color:#fff">'+esc(lv.name)+'</span></td>'
          + '<td>'+esc(r['企业'])+'</td>'
          + '<td style="white-space:nowrap">'+esc(r['地点']||'待定')+'</td>'
          + '<td class="muted" style="font-size:12px">'+esc(r['对口说明']||'')+'</td>'
          + '<td style="white-space:nowrap">';
      if(r['链接']) html+='<button class="btn sm" onclick="window.open(\''+esc(r['链接']).replace(/'/g,"\\'")+'\',\'_blank\')">详情</button> ';
      html+='<button class="btn sm" onclick="addTalkToCalendar('+idx+')">加日历</button>';
      html+='</td></tr>';
    });
    html+='</tbody></table></div>';
  }

  if(TALKS.cross && TALKS.cross.length){
    html+='<div class="card" style="padding:0;overflow:auto;margin-top:14px">'
        + '<div style="padding:12px 16px 6px"><h3 style="margin-bottom:2px">江苏其他高校（可跨校蹭场）</h3>'
        + '<div class="muted" style="font-size:12px">这些企业不进江大，但在南京有站点。信息来自企业官方/高校就业网检索，出发前建议再核实。</div></div>'
        + '<table class="tb resp"><thead><tr>'
        + '<th>日期</th><th>企业</th><th>学校</th><th>时间</th><th>地点</th><th>可信度</th>'
        + '</tr></thead><tbody>';
    TALKS.cross.forEach(function(r){
      html+='<tr><td style="white-space:nowrap"><b>'+esc(r['日期'])+'</b> '
          + '<span class="muted">'+talkWeekday(r['日期'])+'</span></td>'
          + '<td>'+esc(r['企业'])+'</td>'
          + '<td>'+esc(r['学校'])+'</td>'
          + '<td style="white-space:nowrap">'+esc(r['时间']||'待定')+'</td>'
          + '<td>'+esc(r['地点']||'')+'</td>'
          + '<td class="muted" style="font-size:12px">'+esc(r['可信度']||'')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  c.innerHTML=html;

  var kw=document.getElementById('tkKw');
  if(kw) kw.addEventListener('input', function(){
    TALKS.kw=this.value;
    var pos=this.selectionStart;
    renderTalks();
    var el=document.getElementById('tkKw');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
  });
  var lv=document.getElementById('tkLv');
  if(lv) lv.addEventListener('change', function(){ TALKS.lv=this.value; renderTalks(); });
  var up=document.getElementById('tkUp');
  if(up) up.addEventListener('change', function(){ TALKS.upcoming=this.checked; renderTalks(); });
}
RENDER.talks = renderTalks;

RENDER.profile = function(){
  var c=document.getElementById('content');
  var html='<div class="card"><h3>用户画像 <span class="muted" style="font-weight:400;font-size:12px">编辑后自动保存到本机</span></h3>';
  PROFILE_FIELDS.forEach(function(g){

    html+='<div class="grid2" style="margin-bottom:8px">';
    g.fields.forEach(function(f){
      var v=DB.profile[f.k]||'';
      if(f.ta) html+='<div class="form-group" style="grid-column:1/-1"><label>'+f.l+'</label><textarea class="f" rows="2" data-pk="'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea></div>';
      else html+='<div class="form-group"><label>'+f.l+'</label><input class="f" data-pk="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"></div>';
    });
    html+='</div>';
  });
  html+='<div class="muted" id="profileSavedHint"></div></div>';
  c.innerHTML=html;
  var inputs=c.querySelectorAll('[data-pk]');
  var doSave=debounce(function(){
    inputs.forEach(function(el){ DB.profile[el.getAttribute('data-pk')]=el.value; });
    saveProfile();

    if(h) h.textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN');
  },400);
  inputs.forEach(function(el){ el.addEventListener('input', doSave); });
};

/* ============================================================
   全局搜索
   ============================================================ */
function initSearch(){
  var input=document.getElementById('globalSearch');
  var box=document.getElementById('searchResults');
  input.addEventListener('input', function(){
    var q=input.value.trim().toLowerCase();
    if(!q){ box.style.display='none'; box.innerHTML=''; return; }
    var html='';
    var mc=DB.cards.filter(function(x){return (x.name||'').toLowerCase().indexOf(q)>=0;});
    var mj=DB.jobs.filter(function(j){return ((j.company||'')+' '+(j.title||'')).toLowerCase().indexOf(q)>=0;});
    mc.slice(0,5).forEach(function(x){
      html+='<div class="sr-item" onclick="searchGoCard(\''+x.id+'\')"><span class="sr-type">经历</span><span>'+esc(x.name)+'</span></div>';
    });
    mj.slice(0,5).forEach(function(j){
      html+='<div class="sr-item" onclick="searchGoJob(\''+j.id+'\')"><span class="sr-type">岗位</span><span>'+esc(j.company)+' · '+esc(j.title)+'</span></div>';
    });
    if(!html) html='<div class="sr-empty">未找到匹配的经历或岗位</div>';
    box.innerHTML=html; box.style.display='block';
  });
  input.addEventListener('keydown', function(e){ if(e.key==='Escape'){ box.style.display='none'; input.blur(); } });
  document.addEventListener('click', function(e){
    if(!document.getElementById('searchBox').contains(e.target)) box.style.display='none';
  });
}
function searchGoCard(id){
  document.getElementById('searchResults').style.display='none';
  document.getElementById('globalSearch').value='';
  switchView('cards'); openCardForm(id);
}
function searchGoJob(id){
  document.getElementById('searchResults').style.display='none';
  document.getElementById('globalSearch').value='';
  switchView('jobs'); openJobDetail(id);
}

/* ============================================================
   初始化（防御性顺序：加载 → 状态 → 统一渲染）
   ============================================================ */
function init(){
  setStoreBadge();
  /* 先执行一次 loadAll（同步回退）确保 DB 有数据 */
  if(USE_API){
    fetch('/api/all',{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){
        DB.profile=d.profile||{}; DB.cards=d.cards||[]; DB.jobs=d.jobs||[];
        DB.apps=d.apps||[]; DB.events=d.events||[];
        DBINFO=d.db||null; API_OK=true; setStoreBadge();
        _doInitUI();
      })
      .catch(function(e){
        console.warn('API 加载失败，使用 localStorage 回退:', e);
        lsLoadAll(); API_OK=false; setStoreBadge();
        _doInitUI();
      });
  }else{
    lsLoadAll(); setStoreBadge();
    _doInitUI();
  }
}
function _doInitUI(){
  document.getElementById('menuBtn').addEventListener('click', function(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sideOverlay').classList.toggle('show');
  });
  document.getElementById('sideOverlay').addEventListener('click', function(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sideOverlay').classList.remove('show');
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target===this) closeModal();
  });
  initSearch();
  refreshAll();
}
document.addEventListener('DOMContentLoaded', init);
/* 种子初始化在页面渲染后异步执行，不阻塞 UI */
window.addEventListener('load', function(){
  if(USE_API){
    fetch('/api/all',{cache:'no-store'}).then(function(r){return r.json();})
      .then(function(d){
        var meta=d.meta||{};
        if(meta.seeded && String(meta.seeded).indexOf('true')>=0) return;
        doSeed();
        fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)})
          .then(function(){ return fetch('/api/meta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({seeded:'true'})}); })
          .then(function(){ refreshAll(); });
      }).catch(function(){});
  }
});
