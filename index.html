<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求职工作台 · 校招全流程管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='7' width='20' height='14' rx='2' fill='%232563eb'/%3E%3Cpath d='M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2' fill='%232563eb'/%3E%3C/svg%3E">
<style>
:root{
  --primary:#2563eb; --primary-dark:#1d4ed8; --primary-light:#eff6ff;
  --bg:#f4f6f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --red:#dc2626; --orange:#ea580c; --blue:#2563eb;
  --green:#16a34a; --yellow:#ca8a04; --gray:#6b7280;
  --radius:10px; --sidebar-w:216px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ===== 布局 ===== */
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);background:#0f172a;color:#cbd5e1;position:fixed;top:0;left:0;bottom:0;z-index:50;display:flex;flex-direction:column;transition:transform .25s}
#sidebar .brand{padding:20px 18px;font-size:16px;font-weight:700;color:#fff;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:8px}
#sidebar .brand svg{flex:none}
#nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#cbd5e1;cursor:pointer;margin-bottom:2px;font-size:14px;user-select:none}
.nav-item svg{flex:none;opacity:.8}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item.active svg{opacity:1}
#sidebar .foot{padding:14px 18px;font-size:12px;color:#64748b;border-top:1px solid #1e293b}
.store-badge{display:flex;align-items:center;gap:6px;line-height:1.4;font-size:11.5px}
.store-badge .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#f59e0b}
.store-badge.ok{color:#34d399}.store-badge.ok .dot{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.store-badge.warn{color:#fbbf24}.store-badge.warn .dot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.foot-path{margin-top:6px;font-size:10.5px;color:#475569;word-break:break-all;line-height:1.35}

#main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0}
#topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:40}
#menuBtn{display:none;background:none;border:none;padding:8px;min-width:44px;min-height:44px;align-items:center;justify-content:center}
#pageTitle{font-size:17px;font-weight:600;white-space:nowrap}
#searchBox{margin-left:auto;position:relative;width:320px;max-width:46vw}
#globalSearch{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;background:#f9fafb;font-size:14px;min-height:38px}
#searchBox .sicon{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none}
#searchResults{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:320px;overflow-y:auto;display:none;z-index:60}
#searchResults .sr-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f3f4f6}
#searchResults .sr-item:hover{background:var(--primary-light)}
#searchResults .sr-type{font-size:11px;padding:1px 7px;border-radius:10px;background:#eef2ff;color:var(--primary);flex:none}
#searchResults .sr-empty{padding:12px 14px;color:var(--muted);font-size:13px}

#content{padding:22px;flex:1;max-width:1280px;width:100%;margin:0 auto}

/* ===== 通用组件 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:600;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;min-height:38px;transition:background .15s}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark)}
.btn.accent{background:#0d9488;border-color:#0d9488;color:#fff}
.btn.accent:hover{background:#0f766e}
.btn.danger{color:var(--red);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn-green{background:#dcfce7;color:#16a34a;border-color:#bbf7d0}
.btn-green:hover{background:#bbf7d0}
.btn-red{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.btn-red:hover{background:#fecaca}
.btn-sm{padding:4px 10px;min-height:30px;font-size:12px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stat-row{display:flex;align-items:center;gap:14px}
.stat-item{font-size:13px;color:#64748b}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;line-height:20px;font-weight:500}
.tag.red{background:#fee2e2;color:var(--red)}
.tag.blue{background:#dbeafe;color:var(--blue)}
.tag.yellow{background:#fef9c3;color:var(--yellow)}
.tag.gray{background:#f3f4f6;color:var(--gray)}
.tag.green{background:#dcfce7;color:var(--green)}
.tag.orange{background:#ffedd5;color:var(--orange)}
.tag.purple{background:#f3e8ff;color:#9333ea}
.tag.cyan{background:#cffafe;color:#0e7490}
.tag.outline{background:#fff;border:1px solid var(--border);color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

table.tb{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
table.tb th,table.tb td{padding:11px 14px;text-align:left;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
table.tb th{background:#f8fafc;color:#475569;font-weight:600;white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
table.tb tr:last-child td{border-bottom:none}
table.tb tr:hover td{background:#f8fafc}
table.tb td a{color:var(--primary);text-decoration:none;font-weight:500}
table.tb td a:hover{text-decoration:underline}
table.tb .row-num{color:#94a3b8;font-size:12px;width:40px;text-align:center}

/* ===== 招聘信息候选池 ===== */
.cand-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.cand-stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;transition:box-shadow .15s}
.cand-stat:hover{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cand-stat .icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.cand-stat .icon svg{width:20px;height:20px}
.cand-stat .icon.blue{background:#eff6ff;color:#2563eb}
.cand-stat .icon.green{background:#f0fdf4;color:#16a34a}
.cand-stat .icon.red{background:#fef2f2;color:#dc2626}
.cand-stat .icon.orange{background:#fff7ed;color:#ea580c}
.cand-stat .info .num{font-size:22px;font-weight:700;line-height:1.2}
.cand-stat .info .lbl{font-size:12px;color:#64748b}
.cand-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.cand-toolbar select,.cand-toolbar input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;min-height:36px;transition:border-color .15s}
.cand-toolbar select:focus,.cand-toolbar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.cand-toolbar .sep{width:1px;height:24px;background:#e5e7eb;flex:none}
.batch-bar{display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#1e293b,#334155);border-radius:var(--radius);margin-bottom:14px;color:#e2e8f0;font-size:13px}
.batch-bar .count{background:var(--primary);color:#fff;padding:2px 10px;border-radius:12px;font-weight:600;font-size:12px}
.batch-bar label{display:flex;align-items:center;gap:5px;cursor:pointer;color:#94a3b8;font-size:12px}
.batch-bar label:hover{color:#e2e8f0}
.cand-empty{text-align:center;padding:60px 20px;color:#64748b}
.cand-empty svg{opacity:.4;margin-bottom:16px}
.cand-empty p{margin:6px 0}
.cand-empty .hint{font-size:13px;color:#94a3b8}
.cand-title-cell{display:flex;flex-direction:column;gap:3px}
.cand-title-cell .badges{display:flex;gap:4px;flex-wrap:wrap}
.cand-actions{display:flex;gap:6px}
.cand-actions .btn{padding:5px 12px;font-size:12px;border-radius:6px}
.cand-row-pending{background:#fff}
.cand-row-done{background:#fafbfc;opacity:.65}
.cand-row-done:hover{opacity:1}

/* ===== Toast 通知 ===== */
#toastBox{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;color:#fff;pointer-events:auto;animation:toastIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;max-width:380px}
.toast.success{background:#059669}
.toast.error{background:#dc2626}
.toast.info{background:#2563eb}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}

input.f,select.f,textarea.f{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px}
input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid #bfdbfe;border-color:var(--primary)}
textarea.f{resize:vertical;min-height:80px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.form-group .hint{font-size:12px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ===== 模态框 ===== */
#modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
#modalOverlay.show{display:flex}
#modal{background:#fff;border-radius:12px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .m-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
#modal .m-head h3{font-size:16px;flex:1}
#modal .m-close{background:none;border:none;font-size:20px;color:var(--muted);width:36px;height:36px;border-radius:8px}
#modal .m-close:hover{background:#f3f4f6}
#modal .m-body{padding:20px;max-height:65vh;overflow-y:auto}
#modal .m-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}

/* ===== 仪表盘 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-card .num{font-size:30px;font-weight:700;line-height:1.2}
.stat-card .lbl{color:var(--muted);font-size:13px}
.stat-card.accent .num{color:var(--primary)}
.stat-card.green .num{color:var(--green)}
.stat-card.orange .num{color:var(--orange)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff}
.todo-item.overdue{border-color:#fecaca;background:#fef2f2}
.quick-row{display:flex;gap:10px;flex-wrap:wrap}

/* ===== 经历卡片 ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.exp-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;flex-direction:column}
.exp-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:#c7d2fe}
.exp-card .ec-name{font-weight:600;font-size:15px;margin-bottom:6px}
.exp-card .ec-meta{color:var(--muted);font-size:12px;margin-bottom:8px}
.exp-card .ec-text{font-size:13px;color:#374151;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.exp-card .ec-actions{margin-top:10px;display:flex;gap:8px}
.list-view .exp-card{flex-direction:row;align-items:center;gap:16px}
.list-view .exp-card .ec-main{flex:1;min-width:0}
.list-view .exp-card .ec-actions{margin-top:0;flex:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;min-height:38px}

/* ===== 看板 ===== */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.kb-col{flex:0 0 218px;background:#f1f3f7;border-radius:10px;display:flex;flex-direction:column;max-height:70vh}
.kb-col .kb-head{padding:10px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;border-bottom:2px solid transparent}
.kb-col .kb-head .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:#fff;border-radius:10px;padding:0 8px}
.kb-col .kb-body{padding:8px;overflow-y:auto;flex:1;min-height:80px}
/* 卡片：白底圆角 + 悬浮上移，替代以前的裸文字堆 */
.kb-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:box-shadow .15s,border-color .15s,transform .1s;font-size:12px;line-height:1.45}
.kb-card:hover{border-color:#c7d2fe;box-shadow:0 3px 10px rgba(15,23,42,.10);transform:translateY(-1px)}
.kb-card:active{cursor:grabbing}
.kc-co{font-weight:600;font-size:13px;color:var(--text)}
.kc-pos{color:#475569;margin-top:2px}
.kc-date{color:var(--muted);font-size:11px;margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
.kc-date .kc-tag{background:#f1f5f9;border-radius:4px;padding:0 6px;line-height:18px;white-space:nowrap}
.kc-date .kc-tag.overdue{background:#fee2e2;color:var(--red);font-weight:600}
/* 列头状态色：色条 + 圆点，与日历事件色系一致 */
.kb-col .kb-head::before{content:'';width:8px;height:8px;border-radius:50%;flex:none}
.kb-col.st-plan .kb-head{border-bottom-color:#94a3b8}      .kb-col.st-plan .kb-head::before{background:#94a3b8}
.kb-col.st-applied .kb-head{border-bottom-color:var(--blue)} .kb-col.st-applied .kb-head::before{background:var(--blue)}
.kb-col.st-written .kb-head{border-bottom-color:var(--orange)} .kb-col.st-written .kb-head::before{background:var(--orange)}
.kb-col.st-interview .kb-head{border-bottom-color:#0891b2}  .kb-col.st-interview .kb-head::before{background:#0891b2}
.kb-col.st-thanks .kb-head{border-bottom-color:#9ca3af}     .kb-col.st-thanks .kb-head::before{background:#9ca3af}
.kb-col.st-offer .kb-head{border-bottom-color:var(--green)} .kb-col.st-offer .kb-head::before{background:var(--green)}
.kb-col.st-done .kb-head{border-bottom-color:#d1d5db}       .kb-col.st-done .kb-head::before{background:#d1d5db}
/* 拖拽反馈：全部使用不触发重排（layout）的样式，避免 dragleave/dragover 抖动导致卡顿 */
[data-drag]{user-select:none}
.dnd-src{opacity:.35 !important}
.dnd-over{position:relative}
/* 插入指示线：用 ::after 绝对定位绘制，不占据文档流 */
.dnd-over::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--primary);border-radius:2px;pointer-events:none;z-index:5}
.kb-col.dnd-over::after{display:none}
.kb-col.dnd-over{background:#e0e9fb}
.kb-card.dnd-over{box-shadow:0 0 0 2px var(--primary)}
table.tb tr.dnd-over td{position:relative}
table.tb tr.dnd-over::after{left:0;right:0;top:-2px}
table.tb tr{transition:opacity .15s}
.cal-cell.dnd-over,.cal-daycol.dnd-over{background:#e0e9fb;box-shadow:inset 0 0 0 2px var(--primary)}
.cal-cell.dnd-over::after,.cal-daycol.dnd-over::after{display:none}

/* ===== 日历 ===== */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:12px;color:var(--muted);padding:6px 0;font-weight:600}
.cal-cell{background:#fff;border:1px solid var(--border);border-radius:8px;min-height:110px;padding:6px;font-size:12px;cursor:pointer;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.cal-cell:hover{border-color:#c7d2fe;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cal-cell.other{background:#f9fafb;color:#9ca3af}
.cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:#f8faff}
.cal-cell .cd-num{font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.cal-cell .cd-num .cd-add{opacity:0;font-size:14px;color:var(--primary);transition:opacity .15s}
.cal-cell:hover .cd-add{opacity:1}
.cal-ev{display:block;padding:2px 6px;border-radius:4px;color:#fff;font-size:11px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;transition:transform .1s}
.cal-ev:hover{transform:scale(1.02)}
.cal-ev:active{cursor:grabbing}
.cal-ev.deadline{background:var(--red)} .cal-ev.written{background:var(--orange)}
.cal-ev.interview{background:var(--blue)} .cal-ev.follow{background:var(--green)}
.cal-ev.reminder{background:#7c3aed}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-daycol{background:#fff;border:1px solid var(--border);border-radius:8px;min-height:200px;padding:8px}
.cal-daycol h4{font-size:13px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cal-daycol.today{border-color:var(--primary)}
.day-ev{border-left:3px solid var(--gray);background:#f9fafb;border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12px;cursor:pointer;transition:background .15s}
.day-ev:hover{background:#f1f5f9}
.day-ev.deadline{border-color:var(--red)} .day-ev.written{border-color:var(--orange)}
.day-ev.interview{border-color:var(--blue)} .day-ev.follow{border-color:var(--green)}
.day-ev.reminder{border-color:#7c3aed}
.day-ev .de-time{font-weight:600;margin-right:6px}
.day-ev .de-title{flex:1}
.day-ev .de-job{color:var(--muted);font-size:11px;margin-top:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.cal-quick-add{position:absolute;top:2px;right:2px;opacity:0;transition:opacity .15s}
.cal-cell:hover .cal-quick-add{opacity:1}

/* ===== 简历生成 ===== */
.steps{display:flex;gap:0;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1;min-width:120px;text-align:center;padding:10px 6px;font-size:13px;color:var(--muted);border-bottom:3px solid var(--border);cursor:pointer}
.step.active{color:var(--primary);border-color:var(--primary);font-weight:600}
.step.done{color:var(--green);border-color:#bbf7d0}
.match-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff}
.match-pct{font-weight:700;color:var(--primary);min-width:48px;text-align:right}
.order-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#fff}
.resume-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.resume-preview{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:26px 30px;font-size:13px;line-height:1.7}
.resume-preview h1{font-size:20px;margin-bottom:2px}
.resume-preview h2{font-size:14px;border-bottom:2px solid var(--primary);padding-bottom:3px;margin:16px 0 8px;color:var(--primary-dark)}
.resume-preview .rp-contact{color:var(--muted);font-size:12px;margin-bottom:6px}
.resume-preview .rp-item{margin-bottom:12px}
.resume-preview .rp-item .ti{font-weight:600}
.resume-preview .rp-item .tm{color:var(--muted);font-size:12px}

/* ===== 打印 ===== */
#printArea{display:none}
@media print{
  #app,#modalOverlay{display:none !important}
  #printArea{display:block !important;padding:0}
  body{background:#fff}
}

/* ===== 响应式 ===== */
@media (max-width:900px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.3)}

  .btn{min-height:44px}

  table.tb.resp{display:block;overflow-x:auto}
}

<script>
/* ============================================================
   求职工作台 · 单文件应用
   架构：数据层 → 计算层 → 渲染层（单向调用，refreshAll 统一调度）
   ============================================================ */

/* ---------- 常量 ---------- */
var LS = { profile:'wb_job_profile', cards:'wb_job_cards', jobs:'wb_job_jobs',
           apps:'wb_job_apps', events:'wb_job_events', meta:'wb_job_meta' };

/* ---------- Toast 通知 ---------- */
function showToast(msg, type, duration){
  type = type || 'info';
  duration = duration || 3000;
  var box = document.getElementById('toastBox');
  if(!box) return;
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' + esc(msg);
  if(type==='error') t.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'+esc(msg);
  box.appendChild(t);
  setTimeout(function(){ t.style.animation='toastOut .3s ease forwards'; setTimeout(function(){ t.remove(); }, 300); }, duration);
}

var NAV = [
  {id:'dashboard', name:'仪表盘'},
  {id:'cards',     name:'经历卡片库'},
  {id:'jobs',      name:'岗位管理'},
  {id:'resume',    name:'简历生成'},
  {id:'apps',      name:'投递计划'},
  {id:'calendar',  name:'日历'},
  {id:'candidates',name:'招聘信息'},
  {id:'campusnav', name:'校招导航'},
  {id:'talks',     name:'宣讲会日程'},
  {id:'employment',name:'往届就业'},
  {id:'profile',   name:'用户画像'}
];

var CARD_TYPES = ['科研项目','竞赛','实习','论文','课程设计','学生工作'];

var IMPORTANCE = {
  focus:{name:'重点关注', cls:'red'},
  can:  {name:'可投',     cls:'blue'},
  hold: {name:'暂缓',     cls:'yellow'},
  skip: {name:'跳过',     cls:'gray'}
};

/* 岗位卡来源：浏览器插件抓来的卡片在列表里要有可辨认的角标，
   否则一旦用户忘了自己抓过什么，就会反复抓同一个岗位。 */
var JOB_SOURCES = {
  plugin: { name:'插件抓取', cls:'cyan',  host:'浏览器插件' },
  manual: { name:'手动录入', cls:'outline', host:'' }
};
function jobSourceOf(j){
  if(j && (j.sourceHost || j.sourceAdapter || j.capturedAt || j.viaPlugin)) return JOB_SOURCES.plugin;
  return JOB_SOURCES.manual;
}
/* 插件抓来又被「撤销」的卡片：库里留着（软删除），渲染时跳过。
   为什么不真删——页面开着时用户内存里是旧 DB，一次整库覆写就会把删掉的记录复活。 */
function isJobRevoked(j){ return !!(j && j.revoked); }

var APP_STATUS = [
  {id:'plan',      name:'计划投递'},
  {id:'applied',   name:'已投递'},
  {id:'written',   name:'测评'},
  {id:'interview', name:'面试'},
  {id:'thanks',    name:'感谢信'},
  {id:'offer',     name:'Offer'},
  {id:'done',      name:'结束'}
];

var EVENT_TYPES = {
  deadline: {name:'截止日期', cls:'deadline', color:'#dc2626'},
  written:  {name:'笔试',     cls:'written',  color:'#ea580c'},
  interview:{name:'面试',     cls:'interview',color:'#2563eb'},
  follow:   {name:'跟进提醒', cls:'follow',   color:'#16a34a'},
  reminder: {name:'岗位提醒', cls:'reminder', color:'#7c3aed'}
};
/* 未知类型的兜底：数据里出现 EVENT_TYPES 未登记的类型时，
   直接取 .cls/.name 会抛 TypeError，导致整个视图渲染中断、页面空白。 */
var EVENT_FALLBACK = {name:'其他', cls:'follow', color:'#6b7280'};
function evType(t){ return EVENT_TYPES[t] || EVENT_FALLBACK; }

/* 用于 JD 关键词提取与建议标签的词表 */
var KEYWORDS = ['CFD','Fluent','Star-CCM+','OpenFOAM','CATIA','Python','Matlab','MATLAB',
  '气动','空气动力学','热管理','NVH','CAE','仿真','流场','风洞','减阻','热仿真','传热',
  '整车','性能开发','电池','电机','电控','新能源','碰撞','耐久','轻量化','湍流','声学',
  '北京','上海','广州','深圳','杭州','合肥','西安','重庆','长春','武汉','芜湖','宁波','常州'];

/* ---------- 工具 ---------- */
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function todayStr(){ return fmtDate(new Date()); }
function nowStamp(){ var d=new Date(); return fmtDate(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
/* 岗位卡时间戳：手动录入看 createdAt，插件卡回退到首次抓取时间；统一截到分钟 */
function jobTimeOf(j){ return (j.createdAt||j.firstCaptureAt||j.capturedAt||'').slice(0,16); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseDate(s){ var p=String(s||'').split('-'); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((parseDate(a)-parseDate(b))/86400000); }
function debounce(fn,ms){ var t; return function(){ var a=arguments,c=this; clearTimeout(t); t=setTimeout(function(){fn.apply(c,a);},ms); }; }
function weekRange(d){ var x=new Date(d); var dow=(x.getDay()+6)%7; var s=addDays(x,-dow); return [s, addDays(s,6)]; }

/* ---------- 数据层：服务端 SQLite（file:// 直接打开时回退 localStorage） ---------- */
var DB = { profile:{}, cards:[], jobs:[], apps:[], events:[] };
var DBINFO = null;                 /* 服务端返回的数据库信息 */
var USE_API = (location.protocol==='http:'||location.protocol==='https:');
var API_OK = false;                /* 与服务端连通状态 */

function load(key){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }
function save(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ alert('本地存储失败：'+e.message); } }

function setStoreBadge(){
  var el=document.getElementById('storeBadge'); if(!el) return;
  var pe=document.getElementById('dbPath');
  if(pe) pe.textContent = (DBINFO&&DBINFO.path) ? DBINFO.path : '';
  if(USE_API && API_OK){
    var kb = DBINFO && DBINFO.size ? (DBINFO.size/1024).toFixed(0)+' KB' : '';
    el.className='store-badge ok';
    el.innerHTML='<span class="dot"></span>数据库已连接'+(kb?' · '+kb:'');
  }else if(USE_API){
    el.className='store-badge warn';
    el.innerHTML='<span class="dot"></span>未连接数据库（改动仅存本机浏览器）';
  }else{
    el.className='store-badge warn';
    el.innerHTML='<span class="dot"></span>离线模式 · 请用启动器打开';
  }
}

var _pushTimer=null;
function pushNow(){
  return fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(DB)})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(res){ if(res&&res.updated) DBINFO=DBINFO||{}; API_OK=true; setStoreBadge(); })
    .catch(function(e){ API_OK=false; setStoreBadge(); console.warn('保存失败',e); });
}
function push(){ clearTimeout(_pushTimer); _pushTimer=setTimeout(pushNow,250); }

function lsLoadAll(){
  DB.profile = load(LS.profile) || {};
  DB.cards   = load(LS.cards)   || [];
  DB.jobs    = load(LS.jobs)    || [];
  DB.apps    = load(LS.apps)    || [];
  DB.events  = load(LS.events)  || [];
}

function loadAll(){
  if(!USE_API){ lsLoadAll(); setStoreBadge(); return Promise.resolve(); }
  return fetch('/api/all',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      DB.profile=d.profile||{}; DB.cards=d.cards||[]; DB.jobs=d.jobs||[];
      DB.apps=d.apps||[]; DB.events=d.events||[];
      DBINFO=d.db||null; API_OK=true; setStoreBadge();
    })
    .then(function(){ return loadTags(); })
    .catch(function(){ API_OK=false; lsLoadAll(); setStoreBadge(); });
}

function saveProfile(){ USE_API?push():save(LS.profile, DB.profile); }
function saveCards(){ USE_API?push():save(LS.cards, DB.cards); }
function saveJobs(){ USE_API?push():save(LS.jobs, DB.jobs); }
function saveApps(){ USE_API?push():save(LS.apps, DB.apps); }
function saveEvents(){ USE_API?push():save(LS.events, DB.events); }
function saveAll(){ return USE_API?pushNow():Promise.resolve(); }

function seedIfEmpty(){
  var meta;
  if(USE_API){
    /* 服务端模式下先同步读取一次 meta，避免并发写 */
    return fetch('/api/all',{cache:'no-store'}).then(function(r){return r.json();})
      .then(function(d){
        meta = d.meta||{};
        if(meta.seeded && String(meta.seeded).indexOf('true')>=0) return Promise.resolve();
        doSeed();
        DB.meta = meta;
        return pushNow().then(function(){
          return fetch('/api/meta',{method:'POST',headers:{'Content-Type':'application/json'},
                       body:JSON.stringify({seeded:'true'})});
        });
      }).catch(function(){ if(!load(LS.meta)){ doSeed(); } return Promise.resolve(); });
  }
  meta = load(LS.meta);
  if(meta && meta.seeded) return Promise.resolve();
  doSeed();
  save(LS.meta,{seeded:true});
  return Promise.resolve();
}

    name:'', phone:'', email:'',

    createdAt:t};

    {id:uid(), sample:true, title:'远航动力在线笔试', type:'written', date:fmtDate(addDays(wk[0],3)), time:'19:00', jobId:j2.id, remindVal:1, remindUnit:'days'}

/* ---------- 状态 ---------- */
var state = {
  view:'dashboard',
  cardView:'grid', cardTypeFilter:'all', cardSearch:'',
  jobImpFilter:'all', jobTagFilter:'', jobCompanyFilter:'', jobSrcFilter:'all',
  appView:'kanban',
  calMode:'month', calDate:new Date(),
  resume:{ step:1, jobId:null, selected:[] },
  searchOpen:false
};

/* ---------- 计算层 ---------- */
function findCard(id){ for(var i=0;i<DB.cards.length;i++) if(DB.cards[i].id===id) return DB.cards[i]; return null; }
function findJob(id){ for(var i=0;i<DB.jobs.length;i++) if(DB.jobs[i].id===id) return DB.jobs[i]; return null; }
function findApp(id){ for(var i=0;i<DB.apps.length;i++) if(DB.apps[i].id===id) return DB.apps[i]; return null; }

function jobKeywords(job){
  if(!job) return [];
  var text=((job.title||'')+' '+(job.company||'')+' '+(job.jd||'')).toLowerCase();
  var set={};
  (job.tags||[]).forEach(function(t){ if(t) set[t.toLowerCase()]=t; });
  KEYWORDS.forEach(function(k){ if(text.indexOf(k.toLowerCase())>=0) set[k.toLowerCase()]=k; });
  var out=[]; for(var k in set) out.push(set[k]);
  return out;
}
function cardMatchPct(card, kws){
  if(!kws.length) return 0;
  var text=((card.name||'')+' '+(card.resume||'')).toLowerCase();
  var hit=0;
  kws.forEach(function(k){ if(text.indexOf(k.toLowerCase())>=0) hit++; });
  return Math.round(hit/kws.length*100);
}
function suggestedTags(job){
  var cur=(job.tags||[]).map(function(t){return t.toLowerCase();});
  return jobKeywords(job).filter(function(k){ return cur.indexOf(k.toLowerCase())<0; });
}

/* ============================================================
   统一拖拽管理器
   ------------------------------------------------------------
   设计要点（针对原实现「拖动卡顿/卡住」的三类根因）：
   1) 事件委托：dragstart/dragover/drop/dragend 全部挂在 document 上，
      不再给每个行/卡片/日历格内联 ondrag*（避免上百个监听器与闭包）。
   2) 零抖动高亮：高亮只在「放置目标发生变化」时切换一次 class，
      不再依赖 dragleave（dragleave 会从子元素冒泡上来，
      在卡片内部移动时反复 add/remove → 每帧强制重排 → 卡顿）。
      配合 CSS 用 ::after 绝对定位画指示线，高亮本身不改变布局。
   3) 状态兜底清理：drop 与 dragend 都会重置，DOM 重建导致 dragend
      丢失时也不会残留半透明（原实现 ondragend="this.style.opacity=1"
      在重渲染后永不触发，元素看起来像「卡住」）。
   ------------------------------------------------------------
   约定：拖拽源 data-drag="<kind>" data-id="<id>"
        放置区 data-drop="<kind>" [data-drop-id][data-drop-status][data-drop-date]
   ============================================================ */
var DND = { kind:null, id:null, srcEl:null, overEl:null };

function dndEl(t){
  if(!t) return null;
  if(t.nodeType===3) t=t.parentNode;          /* 文本节点兜底 */
  return (t && t.closest) ? t : null;
}
function dndClearHighlight(){
  if(DND.overEl){ DND.overEl.classList.remove('dnd-over'); DND.overEl=null; }
}
function dndReset(){
  if(DND.srcEl){ DND.srcEl.classList.remove('dnd-src'); }
  dndClearHighlight();
  DND.kind=null; DND.id=null; DND.srcEl=null;
  _dragEventId=null;
}
/* 找到当前指针下最近的放置区（不校验类型，交由调用方比对） */
function dndTarget(ev){
  var el=dndEl(ev.target); if(!el) return null;
  return el.closest('[data-drop]');
}
function dndHit(ev, kind){
  var t=dndTarget(ev);
  return (t && t.getAttribute('data-drop')===kind) ? t : null;
}

document.addEventListener('dragstart', function(ev){
  var el=dndEl(ev.target); if(!el) return;
  var src=el.closest('[data-drag]');
  /* 外部拖入（文件/文本）不是本页元素，直接放行，不接管 */
  if(!src || !ev.dataTransfer) return;
  DND.kind=src.getAttribute('data-drag');
  DND.id=src.getAttribute('data-id');
  DND.srcEl=src;
  try{
    ev.dataTransfer.effectAllowed='move';
    /* 兼容：保留 text/plain，便于外部工具与旧逻辑识别 */
    ev.dataTransfer.setData('text/plain', DND.kind+':'+DND.id);
  }catch(e){}
  if(DND.kind==='event') _dragEventId=DND.id;
  /* 关键：延到下一帧再降透明度。
     浏览器在 dragstart 处理器返回「之后」才截取拖拽幽灵图，
     同步改 opacity 会把半透明状态截进拖影并立即触发一次样式重算。 */
  setTimeout(function(){ if(DND.srcEl) DND.srcEl.classList.add('dnd-src'); },0);
}, false);

document.addEventListener('dragover', function(ev){
  if(!DND.kind) return;                       /* 非本页拖拽，不干预 */
  var t=dndHit(ev, DND.kind);
  if(!t){
    /* 指针移出所有合法放置区：清掉上一个高亮，且不 preventDefault
       → 浏览器显示「禁止」光标，行为可预期 */
    dndClearHighlight();
    return;
  }
  ev.preventDefault();                        /* 允许放置 */
  try{ ev.dataTransfer.dropEffect='move'; }catch(e){}
  /* 只在目标变化时切类 —— 高频 dragover 下几乎不产生 DOM 写入 */
  if(DND.overEl!==t){
    dndClearHighlight();
    t.classList.add('dnd-over');
    DND.overEl=t;
  }
}, false);

/* dragenter 也必须 preventDefault：Firefox / Safari 下仅 preventDefault
   dragover 会让 drop 事件不触发，表现为「拖过去放不下」（像卡住） */
document.addEventListener('dragenter', function(ev){
  if(!DND.kind) return;
  if(dndHit(ev, DND.kind)) ev.preventDefault();
}, false);

document.addEventListener('drop', function(ev){
  if(!DND.kind) return;
  var t=dndHit(ev, DND.kind);
  var kind=DND.kind, id=DND.id;
  dndClearHighlight();
  if(!t){ dndReset(); return; }
  ev.preventDefault();
  ev.stopPropagation();
  dndReset();                                  /* 先复位，后续重渲染也不会残留状态 */
  dndApply(kind, id, t);
}, false);

/* dragend 兜底：拖到无效区域 / 按 Esc 取消时，DOM 未被重建，
   由浏览器保证触发，用于清理半透明与全局状态 */
document.addEventListener('dragend', function(){ dndReset(); }, false);

function dndApply(kind, id, target){
  try{
    if(kind==='company')     moveCompanyBefore(id, target.getAttribute('data-drop-id'));
    else if(kind==='job')    dropJobBefore(id, target.getAttribute('data-drop-id'));
    else if(kind==='app')    dropApp(id, target.getAttribute('data-drop-status'), target.getAttribute('data-drop-id'));
    else if(kind==='event')  dropEvent(id, target.getAttribute('data-drop-date'));
  }catch(e){ console.error('拖拽处理失败', e); showToast('拖拽处理失败：'+e.message,'error'); }
}

RENDER.dashboard = function(){
  var c=document.getElementById('content');
  var today=todayStr();
  var wk=weekRange(new Date());
  var wkS=fmtDate(wk[0]), wkE=fmtDate(wk[1]);

  /* 待办：逾期投递 + 今天事件 + 7天内截止 */
  var todos=[];
  DB.apps.forEach(function(a){
    if(a.status==='plan' && a.planDate && a.planDate<today)
      todos.push({overdue:true, text:'逾期未投递：'+a.company+' · '+a.position+'（计划 '+a.planDate+'）', act:'markApplied(\''+a.id+'\')', actName:'标记已投递'});
    if(a.status==='plan' && a.planDate===today)
      todos.push({overdue:false, text:'今天计划投递：'+a.company+' · '+a.position, act:'markApplied(\''+a.id+'\')', actName:'标记已投递'});
  });
  DB.events.forEach(function(e){
    if(e.date===today) todos.push({overdue:false, text:'今天：'+e.title+'（'+evType(e.type).name+(e.time?' '+e.time:'')+'）', act:'', actName:''});
  });
  var deadlines=[];
  DB.events.forEach(function(e){
    if(e.type==='deadline' && e.date>=today && diffDays(e.date,today)<=7) deadlines.push(e);
  });
  deadlines.sort(function(a,b){return a.date<b.date?-1:1;});
  var weekEv=[];
  DB.events.forEach(function(e){
    if((e.type==='written'||e.type==='interview') && e.date>=wkS && e.date<=wkE) weekEv.push(e);
  });
  weekEv.sort(function(a,b){return a.date<b.date?-1:1;});
  var planCount=DB.apps.filter(function(a){return a.status==='plan';}).length;

  /* 统计 */
  var total=DB.apps.length;
  var replied=DB.apps.filter(function(a){return ['written','interview','thanks','offer','done'].indexOf(a.status)>=0 && a.appliedDate;}).length;
  var interviewing=DB.apps.filter(function(a){return a.status==='interview';}).length;
  var offers=DB.apps.filter(function(a){return a.status==='offer';}).length;

  /* SVG 状态分布条形图 */
  var max=1, counts={};
  APP_STATUS.forEach(function(s){ counts[s.id]=0; });
  DB.apps.forEach(function(a){ counts[a.status]=(counts[a.status]||0)+1; });
  APP_STATUS.forEach(function(s){ if(counts[s.id]>max) max=counts[s.id]; });
  var barColors={plan:'#94a3b8',applied:'#2563eb',written:'#ea580c',interview:'#7c3aed',thanks:'#ca8a04',offer:'#16a34a',done:'#9ca3af'};
  var svgH=APP_STATUS.length*26+10, svg='<svg width="100%" height="'+svgH+'" viewBox="0 0 600 '+svgH+'" preserveAspectRatio="xMinYMin meet">';
  APP_STATUS.forEach(function(s,i){
    var y=i*26+6, w=Math.round(counts[s.id]/max*380);
    svg+='<text x="0" y="'+(y+13)+'" font-size="12" fill="#6b7280">'+s.name+'</text>'
      +'<rect x="86" y="'+y+'" width="'+Math.max(w,counts[s.id]?6:0)+'" height="16" rx="4" fill="'+barColors[s.id]+'"/>'
      +'<text x="'+(94+Math.max(w,counts[s.id]?6:0))+'" y="'+(y+13)+'" font-size="12" fill="#374151">'+counts[s.id]+'</text>';
  });
  svg+='</svg>';

  var html='';
  /* 今天要处理 */
  html+='<div class="card"><h3>今天要处理</h3>';
  if(!todos.length) html+='<div class="muted">今天没有待处理事项，继续保持。</div>';
  todos.forEach(function(t){
    html+='<div class="todo-item'+(t.overdue?' overdue':'')+'">'
      +(t.overdue?'<span class="tag red">逾期</span>':'<span class="tag blue">今天</span>')
      +'<span style="flex:1">'+esc(t.text)+'</span>'
      +(t.act?'<button class="btn sm primary" onclick="'+t.act+'">'+esc(t.actName)+'</button>':'')
      +'</div>';
  });
  html+='</div>';

  /* 待办概览 */
  html+='<div class="card"><h3>待办概览</h3><div class="stat-grid">'
    +'<div class="stat-card accent"><div class="num">'+planCount+'</div><div class="lbl">待投递岗位</div></div>'
    +'<div class="stat-card orange"><div class="num">'+weekEv.length+'</div><div class="lbl">本周笔试/面试</div></div>'
    +'<div class="stat-card"><div class="num" style="color:var(--red)">'+deadlines.length+'</div><div class="lbl">7 天内截止日期</div></div>'
    +'</div>';
  if(weekEv.length){
    html+='<div style="margin-bottom:8px"><b>本周安排：</b>';
    weekEv.forEach(function(e){
      html+='<span class="tag '+(e.type==='written'?'orange':'blue')+'">'+esc(e.date)+' '+esc(e.title)+'</span>';
    });
    html+='</div>';
  }
  if(deadlines.length){
    html+='<div><b>临近截止：</b>';
    deadlines.forEach(function(e){
      html+='<span class="tag red">'+esc(e.date)+' '+esc(e.title)+'</span>';
    });
    html+='</div>';
  }
  html+='</div>';

  /* 进度统计 */
  html+='<div class="card"><h3>投递进度统计</h3><div class="stat-grid">'
    +'<div class="stat-card accent"><div class="num">'+total+'</div><div class="lbl">投递总数</div></div>'
    +'<div class="stat-card"><div class="num">'+replied+'</div><div class="lbl">已回复</div></div>'
    +'<div class="stat-card orange"><div class="num">'+interviewing+'</div><div class="lbl">面试中</div></div>'
    +'<div class="stat-card green"><div class="num">'+offers+'</div><div class="lbl">Offer</div></div>'
    +'</div><div style="max-width:640px">'+svg+'</div></div>';

  /* 快捷入口 + 数据管理 */

    +'<button class="btn primary" onclick="openCardForm()">新建经历卡片</button>'
    +'<button class="btn primary" onclick="openJobForm()">新增岗位</button>'
    +'<button class="btn" onclick="switchView(\'apps\')">查看投递计划</button>'
    +'<button class="btn" onclick="switchView(\'calendar\')">查看日历</button>'
    +'</div><hr style="border:none;border-top:1px solid var(--border);margin:14px 0">'
    +'<h3 style="font-size:14px;margin-bottom:10px">数据管理</h3>'
    +'<div class="quick-row">'
    +'<button class="btn primary" onclick="createBackup()" title="立即创建数据库快照"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 创建备份</button>'
    +'<button class="btn" onclick="showBackupList()" title="查看备份列表并恢复"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> 恢复备份</button>'
    +'<div class="sep"></div>'

    +'</div>';

  c.innerHTML=html;
};

/* ---------- 备份 / 恢复 / 清示例 ---------- */
function exportJSON(){
  var data={profile:DB.profile,cards:DB.cards,jobs:DB.jobs,apps:DB.apps,events:DB.events};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='求职工作台备份_'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d || typeof d!=='object') throw new Error('格式不正确');
      if(d.profile) DB.profile=d.profile;
      if(d.cards) DB.cards=d.cards;
      if(d.jobs) DB.jobs=d.jobs;
      if(d.apps) DB.apps=d.apps;
      if(d.events) DB.events=d.events;
      if(USE_API){
        /* 服务端模式：整包事务写入数据库 */
        fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({profile:DB.profile,cards:DB.cards,jobs:DB.jobs,
                                   apps:DB.apps,events:DB.events})})
          .then(function(r){return r.json()})
          .then(function(res){
            if(!res.ok) throw new Error(res.error||'写入失败');
            return loadAll().then(function(){ refreshAll();
              alert('已导入数据库：经历 '+res.imported.cards+' 条、岗位 '+res.imported.jobs
                    +' 条、投递 '+res.imported.apps+' 条、日程 '+res.imported.events+' 条'); });
          })
          .catch(function(e){ alert('导入数据库失败：'+e.message); });
      }else{
        saveProfile(); saveCards(); saveJobs(); saveApps(); saveEvents();
        alert('导入成功'); refreshAll();
      }
    }catch(e){ alert('导入失败：'+e.message); }
    input.value='';
  };
  r.readAsText(f);
}
function clearSamples(){
  if(!confirm('确定清空所有示例数据？（仅删除标记为示例的条目，不影响你自己录入的数据）')) return;
  DB.cards=DB.cards.filter(function(x){return !x.sample;});
  DB.jobs=DB.jobs.filter(function(x){return !x.sample;});
  DB.apps=DB.apps.filter(function(x){return !x.sample;});
  DB.events=DB.events.filter(function(x){return !x.sample;});
  saveCards(); saveJobs(); saveApps(); saveEvents(); refreshAll();
}

/* ===== 数据库备份管理 ===== */
function createBackup(){
  showToast('正在创建备份…','info',3000);
  fetch('/api/backup/create',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){
        var sizeKB=(d.size/1024).toFixed(1);
        showToast('备份创建成功：'+d.name+' ('+sizeKB+' KB)','success');

function restoreBackup(name){
  if(!confirm('确定要从备份「'+name+'」恢复数据库？\n\n当前数据将被覆盖，系统会自动创建一个安全备份。')) return;
  showToast('正在恢复…','info',5000);
  fetch('/api/backup/restore',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:name})})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){
        showToast('恢复成功！已从 '+d.restored+' 恢复，安全备份：'+d.safety_backup,'success');
        /* 重新加载数据 */
        loadAll().then(function(){refreshAll();closeModal();});
      }else{
        showToast('恢复失败：'+d.error,'error');
      }
    })
    .catch(function(e){showToast('请求失败：'+e.message,'error')});
}

function formatSize(bytes){
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

var _tagsCache = [];
/* 规则标签类型：与 server.py 的 RULE_TYPES 保持一致 */
var RULE_TYPES = {
  max_apply: { name:'最多投递 N 个岗位', text:function(n){ return '最多投递 '+n+' 个岗位'; } }
};
function loadTags(){
  if(!USE_API) return Promise.resolve(_tagsCache);
  return fetch('/api/tags').then(function(r){return r.json();})
    .then(function(d){
      _tagsCache=(d.tags||[]).map(function(t){
        t.kind=t.kind||'normal';
        t.ruleType=t.ruleType||'';
        t.ruleValue=Number(t.ruleValue||0);
        return t;
      });
      return _tagsCache;
    })
    .catch(function(){ _tagsCache=[]; return []; });
}
function isRuleTag(t){ return !!(t && t.kind==='rule' && RULE_TYPES[t.ruleType]); }
function ruleText(t){ return isRuleTag(t) ? RULE_TYPES[t.ruleType].text(t.ruleValue) : ''; }
function ruleTypeOptions(sel){
  var h='';
  for(var k in RULE_TYPES) h+='<option value="'+k+'"'+(sel===k?' selected':'')+'>'+RULE_TYPES[k].name+'</option>';
  return h;
}
function postTag(payload){
  return fetch('/api/tags',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)}).then(function(r){return r.json();});
}

/* ---------- 企业维度规则聚合（规则标签打在岗位 → 对所属企业生效） ---------- */
function companyRuleMap(){
  var map={};
  var rules=_tagsCache.filter(isRuleTag);
  if(!rules.length) return map;
  DB.jobs.forEach(function(j){
    var comp=(j.company||'').trim(); if(!comp) return;
    (j.tags||[]).forEach(function(tn){
      var rt=null;
      rules.forEach(function(t){ if(t.name===tn) rt=t; });
      if(!rt) return;
      /* 同一企业命中多条规则时取最严（阈值最小） */
      if(!map[comp] || rt.ruleValue<map[comp].limit) map[comp]={company:comp, limit:rt.ruleValue, tag:rt};
    });
  });
  Object.keys(map).forEach(function(comp){
    var m=map[comp];
    /* 口径：投递计划中该企业的记录数，不含「结束」 */
    m.used=DB.apps.filter(function(a){ return (a.company||'').trim()===comp && a.status!=='done'; }).length;
    m.over=m.used>m.limit;
  });
  return map;
}
function checkCompanyRule(company,delta){
  var m=companyRuleMap()[(company||'').trim()];
  if(!m) return null;
  var next=m.used+(delta||0);
  return {company:m.company, limit:m.limit, used:m.used, next:next, over:next>m.limit, tag:m.tag};
}
/* 软提醒：超限返回 false（调用方据此中止），未命中规则返回 true */
function ruleWarn(company,delta,actionText){
  var r=checkCompanyRule(company,delta);
  if(!r||!r.over) return true;
  return confirm('⚠ 触发投递规则\n\n企业：'+r.company
    +'\n规则：'+ruleText(r.tag)
    +'\n当前：'+r.used+' 个，本次操作后：'+r.next+' 个（超出 '+(r.next-r.limit)+' 个）\n\n仍要继续'+(actionText||'')+'吗？');
}

      +'<div id="newTagPreview" class="muted" style="font-size:12px;margin-top:8px"></div>'
      +'</div>';
    openModal('标签管理（普通标签 / 投递规则）', body, '<button class="btn" onclick="closeModal()">关闭</button>');
    toggleNewRuleFields();

function tagRow(t){
  var rule=isRuleTag(t);
  var badge=rule?'<span style="font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid '+esc(t.color)+';color:'+esc(t.color)+';background:'+esc(t.color)+'18">'+esc(ruleText(t))+'</span>':'';

function addTag(){

function deleteTag(id){

function toggleCompanyGroup(company){
  jobCollapsed[company]=!jobCollapsed[company];
  save('job_collapsed', jobCollapsed);
  RENDER.jobs();
}
/* 企业排序：以「当前实际渲染顺序」为基准重排，避免 companyOrder 尚未
   覆盖全部企业时 indexOf 返回 -1、把被拖企业甩到末尾的老问题 */
function moveCompanyBefore(dragging, beforeCompany){
  if(!dragging || dragging===beforeCompany) return;
  var base=_renderedCompanies.length ? _renderedCompanies.slice() : companyOrder.slice();
  if(base.indexOf(dragging)<0) base.push(dragging);
  if(base.indexOf(beforeCompany)<0 && beforeCompany) base.push(beforeCompany);
  var i=base.indexOf(dragging);
  base.splice(i,1);
  var j=base.indexOf(beforeCompany);
  if(j<0) j=base.length;
  base.splice(j,0,dragging);
  companyOrder=base;
  save('company_order', companyOrder);
  RENDER.jobs();
}

/* 企业投递规则面板（岗位管理页顶部） */
function renderCompanyRulePanel(){
  // 检查是否存在任何规则标签
  var ruleTags=_tagsCache.filter(isRuleTag);
  if(!ruleTags.length) return '';

  var map=companyRuleMap();
  var keys=Object.keys(map);
  var h='<div class="card" style="margin-bottom:12px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">'
    +'<b>企业投递规则</b>'
    +'<span class="spacer"></span>'
    +'<button class="btn sm" onclick="showTagManager()">管理规则标签</button>'
    +'</div>';

  if(keys.length){
    // 有企业受规则约束 → 显示进度
    keys.sort(function(a,b){
      return ((map[b].over?1:0)-(map[a].over?1:0)) || a.localeCompare(b);
    });
    var over=keys.filter(function(k){ return map[k].over; }).length;
    h+='<div class="muted" style="font-size:12px;margin-bottom:8px">'+keys.length+' 家企业受约束'
      +(over?' · <span style="color:#dc2626">'+over+' 家已超限</span>':'')+'</div>';
    keys.forEach(function(k){
      var m=map[k];
      var color=m.over?'#dc2626':(m.used>=m.limit?'#ea580c':'#16a34a');
      var pct=Math.min(100, Math.round(m.used/Math.max(m.limit,1)*100));
      h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid '
        +(m.over?'#dc2626':'var(--border)')+';border-radius:8px;margin-bottom:6px'
        +(m.over?';background:#dc26260f':'')+'">'
        +'<span style="min-width:110px;font-weight:500">'+esc(m.company)+'</span>'
        +'<span class="muted" style="font-size:12px;min-width:140px">'+esc(ruleText(m.tag))+'</span>'
        +'<div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden">'
        +'<div style="height:100%;width:'+pct+'%;background:'+color+'"></div></div>'
        +'<span style="min-width:52px;text-align:right;font-size:13px;color:'+color+';font-weight:500">'+m.used+' / '+m.limit+'</span>'
        +(m.over?'<span style="color:#dc2626;font-size:12px">超限</span>':'')
        +'</div>';
    });
    h+='<div class="muted" style="font-size:11px;margin-top:6px">口径：投递计划中该企业的记录数（不含「结束」）。规则来自打在该企业岗位上的规则标签，多条取最严。</div>';
  } else {
    // 有规则标签但没打在任何岗位上 → 提示如何使用
    h+='<div style="padding:12px;background:#fef9c3;border-radius:8px;font-size:13px;line-height:1.6">'
      +'<b style="color:#854d0e">如何启用投递规则？</b>'
      +'<div style="margin-top:6px;color:#713f12">在下方岗位列表中，点击「编辑」任意一个岗位，'
      +'在标签栏点击 <b style="color:#dc2626">+ '+esc(ruleTags[0].name)+'</b> 按钮，'
      +'保存后该企业即受此规则约束。你也可以在「标签管理」中创建更多规则标签。</div>'
      +'<div style="margin-top:8px">'
      +ruleTags.map(function(t){ return '<span style="display:inline-block;padding:2px 10px;border-radius:10px;border:1px solid #dc2626;color:#dc2626;background:#dc262618;margin-right:6px">'+esc(t.name)+' · '+esc(ruleText(t))+'</span>'; }).join('')
      +'</div></div>';
  }

  h+='</div>';
  return h;
}

RENDER.jobs = function(){
  var c=document.getElementById('content');
  // 恢复折叠状态
  jobCollapsed = load('job_collapsed') || jobCollapsed;

  var list=DB.jobs.filter(function(j){
    if(isJobRevoked(j)) return false;
    if(state.jobImpFilter!=='all' && j.importance!==state.jobImpFilter) return false;
    if(state.jobSrcFilter && state.jobSrcFilter!=='all'){
      var src = (j.sourceHost||j.sourceAdapter||j.capturedAt||j.viaPlugin) ? 'plugin' : 'manual';
      if(src!==state.jobSrcFilter) return false;
    }
    if(state.jobTagFilter && (j.tags||[]).join(' ').toLowerCase().indexOf(state.jobTagFilter.toLowerCase())<0) return false;
    if(state.jobCompanyFilter && (j.company||'').toLowerCase().indexOf(state.jobCompanyFilter.toLowerCase())<0) return false;
    return true;
  });

  // 排序
  var impOrder={focus:0,can:1,hold:2,skip:3};
  if(jobSort==='imp') list.sort(function(a,b){ return (impOrder[a.importance]||9)-(impOrder[b.importance]||9); });
  else if(jobSort==='company') list.sort(function(a,b){ return (a.company||'').localeCompare(b.company||''); });
  else if(jobSort==='date') list.sort(function(a,b){ return jobTimeOf(a)<jobTimeOf(b)?1:-1; });
  else list.sort(function(a,b){ return (a.sortOrder==null?9999:a.sortOrder)-(b.sortOrder==null?9999:b.sortOrder); });

  // 按企业分组
  var groups={};
  list.forEach(function(j){
    var comp=j.company||'未分类';
    if(!groups[comp]) groups[comp]=[];
    groups[comp].push(j);
  });
  // 企业排序：手动排序 > 自动排序
  var allCompanies=Object.keys(groups);
  var sortedCompanies;
  if(jobSort==='default' && companyOrder.length){
    sortedCompanies=[];
    companyOrder.forEach(function(comp){ if(groups[comp]) sortedCompanies.push(comp); });
    allCompanies.forEach(function(comp){ if(sortedCompanies.indexOf(comp)<0) sortedCompanies.push(comp); });
  } else {
    sortedCompanies=allCompanies.sort(function(a,b){ return a.localeCompare(b); });
  }
  _renderedCompanies=sortedCompanies.slice();

  var html='<div class="toolbar">'
    +'<button class="btn primary" onclick="openJobForm()">新增岗位</button>'
    +'<select onchange="state.jobImpFilter=this.value;refreshAll()">'
    +'<option value="all"'+(state.jobImpFilter==='all'?' selected':'')+'>全部重要程度</option>';
  for(var k in IMPORTANCE) html+='<option value="'+k+'"'+(state.jobImpFilter===k?' selected':'')+'>'+IMPORTANCE[k].name+'</option>';
  html+='</select>'
    +'<select onchange="setJobSort(this.value)">'
    +'<option value="default"'+(jobSort==='default'?' selected':'')+'>手动排序（可拖拽企业）</option>'
    +'<option value="imp"'+(jobSort==='imp'?' selected':'')+'>按重要程度</option>'
    +'<option value="date"'+(jobSort==='date'?' selected':'')+'>按录入时间</option>'
    +'</select>'
    +'<input placeholder="按标签筛选…" value="'+esc(state.jobTagFilter)+'" onchange="state.jobTagFilter=this.value;refreshAll()">'
    +'<input placeholder="按企业筛选…" value="'+esc(state.jobCompanyFilter)+'" onchange="state.jobCompanyFilter=this.value;refreshAll()">'
    +'<select onchange="state.jobSrcFilter=this.value;refreshAll()" title="按来源筛选">'
      +'<option value="all"'+(state.jobSrcFilter==='all'?' selected':'')+'>全部来源</option>'
      +'<option value="plugin"'+(state.jobSrcFilter==='plugin'?' selected':'')+'>插件抓取（'+DB.jobs.filter(function(j){return !isJobRevoked(j)&&(j.sourceHost||j.sourceAdapter||j.capturedAt||j.viaPlugin);}).length+'）</option>'
      +'<option value="manual"'+(state.jobSrcFilter==='manual'?' selected':'')+'>手动录入（'+DB.jobs.filter(function(j){return !isJobRevoked(j)&&!(j.sourceHost||j.sourceAdapter||j.capturedAt||j.viaPlugin);}).length+'）</option>'
    +'</select>'
    +'<span class="spacer"></span>'
    +'<span class="muted" style="font-size:12px">'+sortedCompanies.length+' 家企业 · '+list.length+' 个岗位</span>'
    +'</div>';

  html+=renderCompanyRulePanel();

  if(!list.length){ html+='<div class="card muted">暂无匹配岗位，点击「新增岗位」录入。</div>'; }
  else{
    sortedCompanies.forEach(function(comp){
      var jobs=groups[comp];
      var isCollapsed=jobCollapsed[comp];
      var count=jobs.length;

      // 收集该企业下所有岗位的标签（合并去重）
      var compTags={};
      var ruleTagMap={};
      jobs.forEach(function(j){
        (j.tags||[]).forEach(function(t){
          compTags[t]=true;
          _tagsCache.forEach(function(tag){
            if(tag.name===t && isRuleTag(tag)) ruleTagMap[t]=tag;
          });
        });

      var tagsHtml='';

          var used=DB.apps.filter(function(a){ return (a.company||'').trim()===comp && a.status!=='done'; }).length;
          var over=used>rule.ruleValue;

          tagsHtml+='<span style="font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid '+clr+';color:'+clr+';background:'+clr+'18" title="'+esc(ruleText(rule))+'">'+esc(t)+' '+used+'/'+rule.ruleValue+'</span> ';
        } else {
          // 普通标签 → 灰色小字
          tagsHtml+='<span style="font-size:11px;padding:1px 6px;border-radius:8px;background:#f1f5f9;color:#475569">'+esc(t)+'</span> ';
        }

      // 企业组头（可拖拽）
      html+='<div class="company-group" draggable="true" '
        +'data-drag="company" data-id="'+esc(comp)+'" '
        +'data-drop="company" data-drop-id="'+esc(comp)+'" '
        +'style="margin-bottom:8px;border-radius:8px">'
        +'<div class="company-header" onclick="toggleCompanyGroup(\''+esc(comp)+'\')" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-radius:8px;cursor:pointer;user-select:none">'
        +'<span style="font-size:10px;color:#94a3b8;cursor:grab" title="拖拽排序">⣿</span>'
        +'<span style="font-size:14px;transition:transform .2s;'+(isCollapsed?'transform:rotate(-90deg)':'')+'">▼</span>'
        +'<b style="font-size:14px">'+esc(comp)+'</b>'

        +'<span class="spacer"></span>'

      if(isCollapsed){

        html+='<div style="padding:4px 12px 4px 24px;display:flex;flex-direction:column;gap:0">';
        for(var si=0; si<Math.min(count,3); si++){
          var sj=jobs[si];

        }
        if(count>3) html+='<div style="font-size:11px;color:#94a3b8;margin-top:2px;margin-left:8px">…还有 '+(count-3)+' 个</div>';
        html+='</div>';
      } else {
        // 展开状态：表格
        html+='<div style="padding:4px 12px"><div class="card" style="padding:0;overflow:auto"><table class="tb resp"><thead><tr>'
          +'<th style="width:30px"></th><th>岗位名</th><th>重要程度</th><th>标签</th><th>录入时间</th><th>操作</th></tr></thead><tbody>';
        jobs.forEach(function(j){
          var imp=IMPORTANCE[j.importance]||IMPORTANCE.can;
          var tags=(j.tags||[]).map(function(t){return '<span class="tag outline">'+esc(t)+'</span>';}).join('');
          var metaBits=[];
          if(j.city) metaBits.push(esc(j.city));
          if(j.salary) metaBits.push(esc(j.salary));
          if(j.education) metaBits.push(esc(j.education));
          var metaLine = metaBits.length ? '<div class="muted" style="font-size:11.5px;margin-top:2px">'+metaBits.join(' · ')+'</div>' : '';
          var inPlan=DB.apps.some(function(a){return a.jobId===j.id;});
          html+='<tr draggable="true" '
            +'data-drag="job" data-id="'+j.id+'" '

            +'style="cursor:pointer" onclick="openJobDetail(\''+j.id+'\')">'
            +'<td class="row-num" style="cursor:grab;user-select:none">⣿</td>'
            +'<td><div>'+esc(j.title)+'</div>'+metaLine+'</td>'
            +'<td><span class="tag '+imp.cls+'">'+imp.name+'</span></td>'
            +'<td>'+tags+'</td><td class="muted">'+esc(jobTimeOf(j))+'</td>'
            +'<td onclick="event.stopPropagation()">'
            +(inPlan?'<span class="muted" style="font-size:12px">已入计划</span>':'<button class="btn sm primary" onclick="addToPlan(\''+j.id+'\')">加入计划</button>')

            +' <button class="btn sm danger" onclick="deleteJob(\''+j.id+'\')">删除</button>'
            +'</td></tr>';
        });
        html+='</tbody></table></div></div>';
      }
      html+='</div>';
    });
  }
  c.innerHTML=html;
};

/* 新卡排到最前：先按 sortOrder 理顺数组，头部插入后重编号（与拖拽重编号口径一致，从 0 起） */
function unshiftJob(job){
  DB.jobs.sort(function(a,b){ return (a.sortOrder==null?9999:a.sortOrder)-(b.sortOrder==null?9999:b.sortOrder); });
  DB.jobs.unshift(job);
  DB.jobs.forEach(function(j,i){ j.sortOrder=i; });
}
/* 置顶：把卡片所在企业的整组岗位一起移到最前，该卡同时排到组内第一。
   企业组顺序由 companyOrder 决定（只改 sortOrder 组位置不会动），
   所以组内顺序与组序两条都要写；非手动排序先切回手动，保证结果可见 */
function topJob(id){
  var j=findJob(id); if(!j) return;
  var comp=j.company||'未分类';
  if(jobSort!=='default'){
    jobSort='default';
    showToast('已切换到「手动排序」以保留置顶结果','success');
  }
  /* 1. 组内：该企业的卡按 sortOrder 理顺，目标卡提到组首，全表重编号 */
  var fam=DB.jobs.filter(function(x){ return (x.company||'未分类')===comp; });
  fam.sort(function(a,b){ return (a.sortOrder==null?9999:a.sortOrder)-(b.sortOrder==null?9999:b.sortOrder); });
  var gi=fam.indexOf(j);
  if(gi>0){ fam.splice(gi,1); fam.unshift(j); }
  var rest=DB.jobs.filter(function(x){ return (x.company||'未分类')!==comp; });
  rest.sort(function(a,b){ return (a.sortOrder==null?9999:a.sortOrder)-(b.sortOrder==null?9999:b.sortOrder); });
  DB.jobs=fam.concat(rest);
  DB.jobs.forEach(function(x,i){ x.sortOrder=i; });
  saveJobs();
  /* 2. 组序：以当前渲染顺序为基准（与企业拖拽同口径），目标企业提到最前 */
  var base=_renderedCompanies.length ? _renderedCompanies.slice() : companyOrder.slice();
  if(base.indexOf(comp)<0) base.push(comp);
  if(base[0]===comp && gi===0){ showToast('「'+comp+'」已在最前','info'); rerenderCurrent(); return; }
  base.splice(base.indexOf(comp),1);
  base.unshift(comp);
  companyOrder=base;
  save('company_order', companyOrder);
  showToast('已将「'+comp+'」整组置顶（'+fam.length+' 个岗位）','success');
  rerenderCurrent();
}
/* 岗位行拖拽排序：接受 (拖拽岗位id, 目标岗位id)，不再依赖 dataTransfer */
function dropJobBefore(id, beforeId){
  if(!id || id===beforeId) return;
  var fromIdx=DB.jobs.findIndex(function(x){return x.id===id;});
  var toIdx=DB.jobs.findIndex(function(x){return x.id===beforeId;});
  if(fromIdx<0||toIdx<0) return;
  /* 非手动排序模式下 sortOrder 会被排序规则覆盖，
     拖完会「弹回原位」，这里自动切到手动排序保证拖拽结果可见 */
  if(jobSort!=='default'){
    jobSort='default';
    showToast('已切换到「手动排序」以保留拖拽顺序','success');
  }
  var item=DB.jobs.splice(fromIdx,1)[0];
  // 重新计算toIdx（splice后可能偏移）
  toIdx=DB.jobs.findIndex(function(x){return x.id===beforeId;});
  DB.jobs.splice(toIdx,0,item);
  // 写入sortOrder
  DB.jobs.forEach(function(j,i){ j.sortOrder=i; });
  saveJobs();
  rerenderCurrent();
}

/* 岗位表单：企业规则提示 + 规则标签快捷填入 */
function ruleTagChips(){
  var list=_tagsCache.filter(isRuleTag);
  if(!list.length) return '<span class="muted">暂无，可在「标签管理」中新建</span>';
  return list.map(function(t){
    return '<span style="cursor:pointer;color:'+esc(t.color)+';border:1px solid '+esc(t.color)+';border-radius:10px;padding:1px 8px;margin-right:6px;display:inline-block" '
      +'onclick="appendJobTag(\''+esc(t.name)+'\')" title="'+esc(ruleText(t))+'">+ '+esc(t.name)+'</span>';
  }).join('');
}
function appendJobTag(name){
  var el=document.getElementById('jf_tags'); if(!el) return;
  var cur=(el.value||'').split(/[,，;；]/).map(function(s){return s.trim();}).filter(Boolean);
  if(cur.indexOf(name)<0) cur.push(name);
  el.value=cur.join('，');
}
function updateJobRuleTip(){
  var el=document.getElementById('jf_ruleTip'); if(!el) return;
  var comp=(document.getElementById('jf_company')||{}).value||'';
  comp=comp.trim();
  var r=checkCompanyRule(comp,0);
  if(!r){ el.textContent=''; return; }
  el.innerHTML='该企业受规则约束：'+esc(ruleText(r.tag))+'，当前 '+r.used+' / '+r.limit
    +(r.over?' <span style="color:#dc2626">（已超限）</span>':'');
}

  var j=id?findJob(id):null;
  // 收集已有企业名

  companies.sort();

  var body='<input type="hidden" id="jf_id" value="'+(j?j.id:'')+'">'
    +'<div class="grid2">'
    +'<div class="form-group"><label>企业</label>'
    +'<div class="row"><select class="f" id="jf_company_select" onchange="var v=this.value;document.getElementById(\'jf_company\').value=v" style="flex:1">'
    +'<option value="">-- 选择已有企业 --</option>';
  companies.forEach(function(comp){
    body+='<option value="'+esc(comp)+'"'+((j?j.company:prefillCompany||'')===comp?' selected':'')+'>'+esc(comp)+'</option>';
  });
  body+='</select></div>'
    +'<input class="f" id="jf_company" value="'+esc(j?j.company:(prefillCompany||''))+'" placeholder="或输入新企业名" '
    +'oninput="var s=document.getElementById(\'jf_company_select\');var v=this.value;var found=false;s.options.forEach(function(o){if(o.value===v){o.selected=true;found=true}});if(!found)s.selectedIndex=0;updateJobRuleTip()">'
    +'<div id="jf_ruleTip" class="muted" style="font-size:12px;margin-top:4px"></div>'
    +'</div>'
    +'<div class="form-group"><label>岗位名</label><input class="f" id="jf_title" value="'+esc(j?j.title:'')+'" placeholder="如：CFD 仿真工程师"></div>'
    +'</div>'
    +'<div class="grid2">'
    +'<div class="form-group"><label>重要程度</label><select class="f" id="jf_imp">';
  for(var k in IMPORTANCE) body+='<option value="'+k+'"'+(j&&j.importance===k?' selected':'')+'>'+IMPORTANCE[k].name+'</option>';
  body+='</select></div>'
    +'<div class="form-group"><label>标签 <span class="hint">逗号分隔</span></label><input class="f" id="jf_tags" value="'+esc(j?(j.tags||[]).join('，'):'')+'" placeholder="CFD，气动，深圳">'

function saveJobForm(){
  var id=document.getElementById('jf_id').value;

  if(!company||!title){ alert('请填写企业和岗位名'); return; }
  var tags=document.getElementById('jf_tags').value.split(/[,，;；]/).map(function(s){return s.trim();}).filter(Boolean);
  var data={ company:company, title:title,
    importance:document.getElementById('jf_imp').value,
    tags:tags, link:document.getElementById('jf_link').value.trim(),
    jd:document.getElementById('jf_jd').value };
  if(id){ var j=findJob(id); if(j){ for(var k in data) j[k]=data[k]; } }
  else { data.id=uid(); data.createdAt=nowStamp(); unshiftJob(data); }
  // 同步投递计划：如果该岗位已在计划中，更新对应app记录
  var jobId=id||data.id;
  DB.apps.forEach(function(a){

function autoFillJob(){
  var url=document.getElementById('jf_link').value.trim();
  if(!url){showToast('请先粘贴招聘链接','error');return;}
  if(!url.match(/^https?:\/\//)) url='https://'+url;
  showToast('正在自动填充…','info',5000);
  fetch('/api/autofill?url='+encodeURIComponent(url))
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.ok){
        if(d.title){
          var titleEl=document.getElementById('jf_title');
          if(titleEl && !titleEl.value) titleEl.value=d.title;
        }
        if(d.description){
          var jdEl=document.getElementById('jf_jd');
          if(jdEl && !jdEl.value) jdEl.value=d.description;
          /* 自动提取建议标签 */
          var text=(d.title||'')+' '+(d.description||'');
          var suggestions=[];
          KEYWORDS.forEach(function(kw){
            if(text.toLowerCase().indexOf(kw.toLowerCase())>=0) suggestions.push(kw);
          });
          if(suggestions.length){
            var tagEl=document.getElementById('jf_tags');
            var existing=(tagEl.value||'').split(/[,，]/).map(function(s){return s.trim();}).filter(Boolean);
            var newTags=suggestions.filter(function(s){return existing.indexOf(s)<0;});
            if(newTags.length){
              tagEl.value=(tagEl.value?tagEl.value+'，':'')+newTags.join('，');
              showToast('已自动填充标题、JD 并提取 '+newTags.length+' 个建议标签','success');
            }else{
              showToast('已自动填充标题和 JD','success');
            }
          }else{
            showToast('已自动填充标题和 JD','success');
          }
        }
      }else{
        showToast('自动填充失败：'+(d.error||'未知错误'),'error');
      }
    })
    .catch(function(e){showToast('请求失败：'+e.message,'error')});
}

/* 看板拖放：合并原 dropApp（落到列）与 dropAppBefore（落到卡片）
   —— 统一为「插到 beforeId 之前」，beforeId 为空则追加到目标列末尾。
   原实现的缺陷：beforeId 的索引在「源列」中查找，却 splice 进「目标列」，
   跨列拖动时索引恒为 -1，卡片被塞到倒数第二位（释放后位置不对）。 */
function dropApp(id, status, beforeId){
  var a=findApp(id); if(!a) return;
  var targetStatus=status;
  if(!targetStatus && beforeId){
    var b=findApp(beforeId);
    if(b) targetStatus=b.status;
  }
  if(!targetStatus) return;
  if(beforeId===id) return;                 /* 落到自己身上 */

  var changed=(a.status!==targetStatus);
  var snapshot=DB.apps.map(function(x){return x.id;}).join('|');

  var rest=DB.apps.filter(function(x){ return x.id!==id; });
  var idx=beforeId ? rest.findIndex(function(x){ return x.id===beforeId; }) : -1;
  if(idx>=0){
    rest.splice(idx,0,a);                   /* 插到目标卡片之前 */
  }else{
    /* 无目标卡片（落在列空白处）：追加到该状态列最后一个元素之后，
       保证全局数组顺序与看板展示顺序一致 */
    var last=-1;
    for(var i=0;i<rest.length;i++){ if(rest[i].status===targetStatus) last=i; }
    rest.splice(last+1,0,a);
  }
  /* 状态没变、顺序也没变 → 判定为误拖，不改写 updatedAt、不跳到末尾、不落库 */
  if(!changed && rest.map(function(x){return x.id;}).join('|')===snapshot) return;

  if(changed){
    a.status=targetStatus;
    if(targetStatus==='applied' && !a.appliedDate) a.appliedDate=todayStr();
  }
  a.updatedAt=todayStr();
  DB.apps=rest;
  saveApps();
  rerenderCurrent();
}

    if(!job){ R.step=1; refreshAll(); return; }
    var kws=jobKeywords(job);
    var scored=DB.cards.map(function(x){ return {card:x, pct:cardMatchPct(x,kws)}; });
    scored.sort(function(a,b){return b.pct-a.pct;});
    html+='<div class="card"><h3>第二步：按 JD 匹配度选择经历卡片</h3>'
      +'<div class="muted" style="margin-bottom:10px">目标岗位：<b>'+esc(job.company)+' · '+esc(job.title)+'</b>　关键词：'+kws.map(function(k){return '<span class="tag outline">'+esc(k)+'</span>';}).join('')+'</div>';
    if(!scored.length) html+='<div class="muted">经历卡片库为空，请先在「经历卡片库」中录入。</div>';
    scored.forEach(function(s){
      var checked=R.selected.indexOf(s.card.id)>=0;
      html+='<div class="match-row">'
        +'<input type="checkbox" style="width:18px;height:18px"'+(checked?' checked':'')+' onchange="resumeToggleCard(\''+s.card.id+'\')">'
        +'<div style="flex:1"><b>'+esc(s.card.name)+'</b> <span class="tag blue">'+esc(s.card.type)+'</span><div class="muted">'+esc((s.card.resume||'').slice(0,80))+'…</div></div>'
        +'<div class="match-pct">'+s.pct+'%</div></div>';
    });
    html+='<div class="row" style="margin-top:12px"><button class="btn" onclick="state.resume.step=1;refreshAll()">上一步</button>'
      +'<button class="btn primary" onclick="state.resume.step=3;refreshAll()">下一步：调整与预览（已选 '+R.selected.length+' 项）</button></div></div>';
  }
  else if(R.step===3){
    var job3=findJob(R.jobId);
    if(!job3){ R.step=1; refreshAll(); return; }
    html+='<div class="card"><h3>第三步：调整顺序并实时预览</h3><div class="resume-layout"><div>';
    if(!R.selected.length) html+='<div class="muted">尚未选择任何经历卡片，请返回上一步勾选。</div>';
    R.selected.forEach(function(cid,idx){
      var x=findCard(cid); if(!x) return;
      html+='<div class="order-row"><span class="muted">'+(idx+1)+'.</span><b style="flex:1">'+esc(x.name)+'</b>'
        +'<button class="btn sm" onclick="resumeMove('+idx+',-1)"'+(idx===0?' disabled':'')+'>上移</button>'
        +'<button class="btn sm" onclick="resumeMove('+idx+',1)"'+(idx===R.selected.length-1?' disabled':'')+'>下移</button>'
        +'<button class="btn sm danger" onclick="resumeToggleCard(\''+cid+'\')">移除</button></div>';
    });
    html+='<div class="row" style="margin-top:12px"><button class="btn" onclick="state.resume.step=2;refreshAll()">上一步</button>'
      +'<button class="btn primary" onclick="state.resume.step=4;refreshAll()">下一步：导出</button></div>'
      +'</div><div>'+buildResumePreviewHTML()+'</div></div></div>';
  }
  else{
    html+='<div class="card"><h3>第四步：导出简历</h3>'
      +'<div class="quick-row" style="margin-bottom:14px">'
      +'<button class="btn primary" onclick="exportResumeMD()">导出 Markdown（.md）</button>'
      +'<button class="btn primary" onclick="printResume()">导出 PDF（打印）</button>'
      +'<button class="btn" onclick="state.resume.step=3;refreshAll()">上一步</button>'
      +'</div><div class="muted" style="margin-bottom:14px">PDF 导出将调用浏览器打印对话框，选择「另存为 PDF」即可。</div>'
      +buildResumePreviewHTML()+'</div>';
  }
  c.innerHTML=html;
};
function resumeGoStep(n){
  var R=state.resume;
  if(n>=2 && !R.jobId){ if(!DB.jobs.length){ alert('请先在「岗位管理」中录入岗位'); return; } R.jobId=DB.jobs[0].id; }
  R.step=n; refreshAll();
}
function resumePickJob(){
  var sel=document.getElementById('rs_job');
  if(!sel) return;
  state.resume.jobId=sel.value;
  var job=findJob(sel.value);
  /* 智能预选：匹配度 >30% 的自动勾选 */
  var kws=jobKeywords(job);
  state.resume.selected=[];
  DB.cards.forEach(function(x){ if(cardMatchPct(x,kws)>30) state.resume.selected.push(x.id); });
  if(!state.resume.selected.length && DB.cards.length) state.resume.selected=[DB.cards[0].id];
  state.resume.step=2; refreshAll();
}
function resumeToggleCard(cid){
  var i=state.resume.selected.indexOf(cid);
  if(i>=0) state.resume.selected.splice(i,1); else state.resume.selected.push(cid);
  refreshAll();
}
function resumeMove(idx,dir){
  var arr=state.resume.selected, j=idx+dir;
  if(j<0||j>=arr.length) return;
  var t=arr[idx]; arr[idx]=arr[j]; arr[j]=t;
  refreshAll();
}
function buildResumePreviewHTML(){
  var p=DB.profile, R=state.resume;
  var job=findJob(R.jobId);
  var html='<div class="resume-preview" id="resumePreview">'
    +'<h1>'+esc(p.name||'（姓名）')+'</h1>'
    +'<div class="rp-contact">'+[p.phone,p.email].filter(Boolean).map(esc).join(' · ')+'</div>'
    +'<h2>教育背景</h2><div>'+nl2br(p.edu||'')+'</div>'
    +(p.research?'<h2>研究方向</h2><div>'+nl2br(p.research)+'</div>':'')
    +(p.tech?'<h2>技术栈</h2><div>'+nl2br(p.tech)+'</div>':'');
  if(R.selected.length){
    html+='<h2>相关经历</h2>';
    R.selected.forEach(function(cid){
      var x=findCard(cid); if(!x) return;
      var span=(x.start||'')+(x.end?' ~ '+x.end:'');
      html+='<div class="rp-item"><div class="ti">'+esc(x.name)+' <span class="tm">'+esc(x.type)+(span?' · '+esc(span):'')+'</span></div>'
        +'<div>'+nl2br(x.resume||'')+'</div></div>';
    });
  }
  if(job) html+='<div class="muted" style="margin-top:14px;font-size:11px">—— 针对岗位生成：'+esc(job.company)+' · '+esc(job.title)+' ——</div>';
  html+='</div>';
  return html;
}
function resumeMarkdown(){
  var p=DB.profile, R=state.resume;
  var job=findJob(R.jobId);
  var md='# '+(p.name||'（姓名）')+'\n\n';
  if(p.phone||p.email) md+=[p.phone,p.email].filter(Boolean).join(' · ')+'\n\n';
  md+='## 教育背景\n\n'+(p.edu||'')+'\n\n';
  if(p.research) md+='## 研究方向\n\n'+p.research+'\n\n';
  if(p.tech) md+='## 技术栈\n\n'+p.tech+'\n\n';
  if(R.selected.length){
    md+='## 相关经历\n\n';
    R.selected.forEach(function(cid){
      var x=findCard(cid); if(!x) return;
      var span=(x.start||'')+(x.end?' ~ '+x.end:'');
      md+='### '+x.name+'（'+x.type+(span?' · '+span:'')+'）\n\n';
      (x.resume||'').split('\n').forEach(function(line){ if(line.trim()) md+='- '+line.trim()+'\n'; });
      md+='\n';
    });
  }
  if(job) md+='---\n*针对岗位生成：'+job.company+' · '+job.title+'*\n';
  return md;
}
function exportResumeMD(){
  var blob=new Blob([resumeMarkdown()],{type:'text/markdown;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  var job=findJob(state.resume.jobId);
  a.download='简历_'+(DB.profile.name||'未命名')+(job?'_'+job.company:'')+'.md';
  a.click(); URL.revokeObjectURL(a.href);
}
function printResume(){
  document.getElementById('printArea').innerHTML=buildResumePreviewHTML();
  window.print();
}
